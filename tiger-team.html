    async function continueSession() {
      if (continuationInFlight) return; // Guard against double-submit (Enter + click, or double-click)
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg || !tigerTeamId) return;
      continuationInFlight = true;
      input.value = ''; clearUnsentNote();
      input.disabled = true;
      document.getElementById('btn-send').disabled = true;
      sentInterjections.push(msg);   // drawn just below; its echo from the team's stream is skipped

      // Show user's continuation message
      closeBlock();
      const tl = document.getElementById('timeline');
      const block = document.createElement('div');
      block.className = 'agent-block user-inject';
      block.innerHTML = `
        <div class="agent-block-header">
          <span class="block-icon">👤</span>
          <span class="block-agent">You</span>
          <span class="block-role">Continuation</span>
          <span class="block-time">${stamp()}</span>
        </div>
        <div class="agent-block-body"><div class="text-content">${md(msg)}</div></div>`;
      tl.appendChild(block);
      scrollBottom();

      addDivider('Reconvening Team...', 'round');
      setStatus('running', 'Continuing...');
      document.title = '⏳ Tiger Team - Continuing...';

      // Start the continuation SSE stream
      try {
        const resp = await fetch('/api/tiger-team/continue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: tigerTeamId, message: msg }),
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          if (resp.status === 409) {
            addSystemMsg('⚠ ' + (errData.error || 'A continuation is already in progress for this session.'));
          } else {
            addSystemMsg('Continue failed: ' + (errData.error || `HTTP ${resp.status}`));
          }
          setStatus('error', 'Error');
          input.disabled = false;
          document.getElementById('btn-send').disabled = false;
          return;
        }

        isRunning = true;
        document.getElementById('btn-stop').disabled = false;

        try { await readSSE(resp); await afterStreamEnd('Stream ended without completion'); }
        catch (e) { await afterStreamEnd(e.message); }
      } catch (e) {
        handleEvent({ gateway: { type: 'tt_interrupted', reason: e.message } });
      } finally {
        continuationInFlight = false;
      }
    }

    // ── Block Management ──
    // One card on the timeline. The coordinator's card is `currentBlock`; each member dispatch has its own card in
    // callBlocks (members run at the same time, so their output must never land in whichever card is newest).
    function makeBlock(slug, role) {
      const tl = document.getElementById('timeline');
      const a = agents[slug] || { display: slug, icon: '🤖' };
      const colorClass = getAgentColorClass(slug);

      const block = document.createElement('div');
      block.className = `agent-block ${colorClass}`;
      block.dataset.agent = slug;   // a chip taps through to this member's latest card
      block.innerHTML = `
        <div class="agent-block-header">
          <span class="block-icon">${esc(a.icon || '🤖')}</span>
          <span class="block-agent">${esc(a.display || slug)}</span>
          <span class="block-role">${esc(role)}</span>
          <span class="block-time">${stamp()}</span>
        </div>
        <div class="agent-block-body">
          <div class="text-content"></div>
          <div class="tool-calls-container" style="display:none"></div>
        </div>`;
      tl.appendChild(block);

      setDot(slug, 'working');
      scrollBottom();
      return {
        element: block,
        toolsEl: block.querySelector('.tool-calls-container'),
        textEl: block.querySelector('.text-content'),
        slug,
        role,
        rawText: '',
        toolCount: 0,
        startedAt: eventNow || Date.now(),
      };
    }

    function openBlock(slug, role) {
      closeBlock();
      currentBlock = makeBlock(slug, role);
      currentAgent = slug;
    }

    /** The card of one member dispatch (made on its first event if its dispatch event was missed). */
    function callBlock(key, slug, role) {
      let b = callBlocks.get(key);
      if (!b) { b = makeBlock(slug || 'member', role || 'Participant'); b.key = key; callBlocks.set(key, b); }
      return b;
    }

    function appendBlockText(text, block = currentBlock) {
      if (!block) return;
      block.rawText += text;
      if (block.slug) setMemberStep(block.slug, 'writing…');
      block.textEl.innerHTML = md(block.rawText);
      scrollBottom();
    }

    /** A short line inside a card: a member waiting for its turn, or why it failed. */
    function addBlockNote(block, text, kind) {
      if (!block) return;
      const el = document.createElement('div');
      el.className = 'block-note' + (kind ? ' ' + kind : '');
      el.textContent = text;
      const body = block.element.querySelector('.agent-block-body');
      if (kind === 'task') body.insertBefore(el, body.firstChild); else body.appendChild(el);   // the task heads the card
      scrollBottom();
    }

    /** A member's card is finished: its text drawn in full, its tools marked done, its roster dot updated. */
    function finishCallBlock(block, failed) {
      if (!block || block.done) return;
      block.done = true;
      // "· took 42s": from the card's start to the event that finished it.
      const timeEl = block.element.querySelector('.block-time');
      if (timeEl && block.startedAt) timeEl.textContent += ' · took ' + fmtDuration(((eventNow || Date.now()) - block.startedAt) / 1000);
      block.textEl.innerHTML = md(block.rawText);
      block.element.querySelectorAll('.tool-call-line.running').forEach(line => {
        const spinner = line.querySelector('.tool-call-spinner');
        const status = line.querySelector('.tool-call-status');
        if (failed) {   // cut off before its result: it may or may not have happened
          line.classList.remove('running');
          if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '?'; }
          if (status) status.textContent = 'Interrupted / unknown';
          return;
        }
        line.className = 'tool-call-line done';
        if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '✓'; }
        if (status) { status.className = 'tool-call-status done'; status.textContent = 'Done'; }
      });
      if (failed) block.element.classList.add('failed');
      // The dot shows the agent's latest dispatch: working while any of its cards is still open.
      const stillWorking = [...callBlocks.values()].some(b => b.slug === block.slug && !b.done);
      if (!stillWorking) setDot(block.slug, failed ? 'failed' : 'done');
      attachFileCards(block);   // download cards for files the reply names (also after a replay draws a finished card)
    }

    function markUnfinishedTools() {
      document.querySelectorAll('.tool-call-line.running').forEach(line => {
        line.classList.remove('running');
        const status = line.querySelector('.tool-call-status');
        if (status) status.textContent = 'Interrupted / unknown';
        const spinner = line.querySelector('.tool-call-spinner');
        if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '?'; }
      });
    }

    function closeBlock() {
      if (currentBlock) {
        currentBlock.textEl.innerHTML = md(currentBlock.rawText);
        // Finalize any still-running tools in this block
        currentBlock.element.querySelectorAll('.tool-call-line.running').forEach(line => {
          line.className = 'tool-call-line done';
          const spinner = line.querySelector('.tool-call-spinner');
          if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '✓'; }
          const status = line.querySelector('.tool-call-status');
          if (status) { status.className = 'tool-call-status done'; status.textContent = 'Done'; }
        });
        setDot(currentBlock.slug, 'done');
        attachFileCards(currentBlock);   // the coordinator's card (its final report included)
        currentBlock = null;
      }
    }

    function addTool(name, callId, input, block = currentBlock) {
      if (!block) return;
      if (suppressToolNames.has(name)) return;

      block.toolCount++;
      block.toolsEl.style.display = 'block';
      if (block.slug) setMemberStep(block.slug, toolStepText(name, input));

      // Move tools container before text for proper ordering
      const body = block.element.querySelector('.agent-block-body');
      body.insertBefore(block.toolsEl, block.textEl);

      const inputSummary = input ? (typeof input === 'string' ? input : JSON.stringify(input)).slice(0, 100) : '';

      const domId = toolIdPrefix + (++toolSeq);
      const wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="tool-call-line running" id="tool-${domId}">
          <span class="tool-call-spinner"></span>
          <div class="tool-call-info">
            <span class="tool-call-name">${esc(name)}</span>
            ${inputSummary ? `<span class="tool-call-input">${esc(inputSummary)}</span>` : ''}
          </div>
          <span class="tool-call-status"></span>
          <span class="tool-call-toggle" data-call-id="${domId}">▶ output</span>
        </div>
        <div class="tool-call-result" id="tool-result-${domId}"></div>`;
      block.toolsEl.appendChild(wrapper);
      toolMap.set(callId, { wrapper, name, slug: block.slug, line: wrapper.querySelector('.tool-call-line'), resultEl: wrapper.querySelector('.tool-call-result') });
      scrollBottom();
    }

    function completeTool(callId, result) {
      const entry = toolMap.get(callId);
      if (!entry) return;
      if (entry.slug && (memberStates.get(entry.slug) || {}).state === 'working') {
        // the tool is back: another tool of the same member still running is its step; else it decides what next
        const other = [...toolMap.values()].find(t => t !== entry && t.slug === entry.slug && t.line && /\brunning\b/.test(t.line.className || ''));
        setMemberStep(entry.slug, other ? toolStepText(other.name) : 'thinking…');
      }
      const line = entry.line;
      if (line) {
        line.className = 'tool-call-line done';
        const spinner = line.querySelector('.tool-call-spinner');
        if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '✓'; }
        const status = line.querySelector('.tool-call-status');
        if (status) { status.className = 'tool-call-status done'; status.textContent = 'Done'; }
      }
      const resultEl = entry.resultEl;
      if (resultEl && result) {
        resultEl.textContent = result;
      }
      scrollBottom();
    }

    function toggleToolResult(callId) {
      const el = document.getElementById('tool-result-' + callId);
      if (el) el.classList.toggle('visible');
    }
    // One delegated listener for every "▶ output" toggle, live or re-inserted from a saved transcript
    // (whose inline onclick handlers are stripped): the id comes from a data attribute, else the next sibling.
    document.addEventListener('click', (e) => {
      const t = e.target && e.target.closest && e.target.closest('.tool-call-toggle');
      if (!t) return;
      const id = t.dataset.callId;
      const line = t.closest('.tool-call-line');
      const el = (id && document.getElementById('tool-result-' + id)) || (line && line.nextElementSibling && line.nextElementSibling.classList.contains('tool-call-result') ? line.nextElementSibling : null);
      if (el) el.classList.toggle('visible');
    });

    function finalizeAllTools() {
      // Force all still-running tools to show as done (handles missed tool_result events)
      document.querySelectorAll('.tool-call-line.running').forEach(line => {
        line.className = 'tool-call-line done';
        const spinner = line.querySelector('.tool-call-spinner');
        if (spinner) { spinner.className = 'tool-call-icon'; spinner.textContent = '✓'; }
        const status = line.querySelector('.tool-call-status');
        if (status) { status.className = 'tool-call-status done'; status.textContent = 'Done'; }
      });
    }

    function addDivider(text, type) {
      closeBlock();
      const tl = document.getElementById('timeline');
      const d = document.createElement('div');
      d.className = 'tl-divider ' + (type || '');
      d.textContent = text;
      tl.appendChild(d);
      scrollBottom();
    }

    function addSystemMsg(text) {
      const tl = document.getElementById('timeline');
      const m = document.createElement('div');
      m.className = 'system-msg';
      m.textContent = `⚙ ${text} (${stamp()})`;
      tl.appendChild(m);
      scrollBottom();
    }

    // ── SSE Stream ──
    function startTigerTeam() {
      addDivider(mode === 'roundtable' ? 'Roundtable Starting' : 'Tiger Team Starting', 'round');
      setStatus('running', 'Running');
      setRunning(true);

      const body = JSON.stringify({ coordinator, participants, objective, max_rounds: maxRounds, context, mode, challenger, challengerDirective, directives, alert_id: alertId || undefined, autoLaunched: autoLaunched || undefined });

      fetch('/api/tiger-team/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body })
      .then(async response => {
        if (!response.ok) {
          const t = await response.text();
          setStatus('error', 'Error');
          setRunning(false);
          setInputMode('ended');
          addSystemMsg(`API Error ${response.status}: ${t}`);
          return;
        }
        // The team keeps working if this connection drops: afterStreamEnd follows it again from the last event drawn.
        try { await readSSE(response); await afterStreamEnd('Stream ended without a completion event'); }
        catch (err) { await afterStreamEnd('Stream error: ' + err.message); }
      }).catch(err => {
        handleEvent({ gateway: { type: 'tt_interrupted', reason: 'Connection failed: ' + err.message } });
      });
    }

    /** Read one event stream to its end, drawing every event. Throws on a network error. */
    async function readSSE(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') continue;
          try { handleEvent(JSON.parse(raw)); } catch (e) { console.warn('Parse error:', e, raw.slice(0, 200)); }
        }
      }
    }

    /**
     * A stream ended. If no final event came, the team may still be working (only Stop ends a team now): follow it
     * again from the last event drawn, retrying while the network is away. Old hubs without live replay keep the
     * old behaviour (the session counts as interrupted).
     */
    async function afterStreamEnd(reason) {
      if (!isRunning) return;
      if (tigerTeamId && streamSupported !== false && await followTeam()) return;
      if (isRunning) handleEvent({ gateway: { type: 'tt_interrupted', reason } });
    }

    let following = false;
    async function followTeam() {
      if (following) return true;
      following = true;
      try {
        for (let attempt = 0; isRunning; attempt++) {
          if (attempt) await new Promise(r => setTimeout(r, Math.min(15000, 2000 * 2 ** Math.min(attempt - 1, 3))));
          let resp;
          try { resp = await fetch(`/api/tiger-team/stream?id=${encodeURIComponent(tigerTeamId)}&since=${lastSeq}`); }
          catch { if (attempt === 1) addSystemMsg('Connection lost. The team keeps working; reconnecting…'); continue; }
          if (resp.status === 404 || resp.status === 400) {
            const d = await resp.json().catch(() => ({}));
            if (d.legacy || d.error === 'Not found') streamSupported = false;   // a team from before live replay, or an old hub
            return false;
          }
          if (resp.status === 401 || resp.status === 403) { addSystemMsg('Signed out: reload the page and sign in to follow the team again.'); return false; }
          if (!resp.ok) continue;
          streamSupported = true;
          if (attempt) addSystemMsg('↻ Reconnected to the team');
          const before = lastSeq;
          try { await readSSE(resp); } catch { /* dropped again: loop */ }
          if (isRunning && lastSeq === before) {
            // A round that brought nothing new: ask how the team stands, so a finished team never leaves this page waiting.
            try {
              const st = await (await fetch('/api/tiger-team/status?id=' + encodeURIComponent(tigerTeamId))).json();
              if (st && st.status && !['running', 'retrying', 'stopping'].includes(st.status)) handleEvent({ gateway: { type: 'tt_state', status: st.status, error: st.error || null } });
            } catch { /* offline: the next round asks again */ }
          }
        }
        return true;
      } finally { following = false; }
    }

    /**
     * Draw a journaled team from its own events (every card as it happened), then follow it live when it is still
     * working. Returns false for teams saved before live replay (the caller shows the saved transcript instead).
     */
    async function loadTeam(id) {
      let s;
      try {
        const r = await fetch('/api/tiger-team/status?id=' + encodeURIComponent(id));
        if (!r.ok) return false;
        s = await r.json();
      } catch { return false; }
      if (!s || !s.has_stream) return false;
      tigerTeamId = s.id; saveKey = s.id; sessionId = null;
      coordinator = s.coordinator; participants = s.participants || []; mode = s.mode || 'led'; challenger = s.challenger || '';
      objective = s.objective || objective; objectiveText = objective;
      showObjective(objective);
      getAgentColorClass(coordinator); participants.forEach(p => getAgentColorClass(p));
      memberStates.clear();   // the replay below rebuilds every member's state from the events
      buildRoster();
      document.getElementById('timeline').innerHTML = '';
      resetApprovals();
      callBlocks.clear(); currentBlock = null; lastSeq = 0; clockSet = false;
      document.getElementById('btn-save').disabled = false;
      isRunning = true;   // until the history says how it ended (a final event, or tt_state at the end of the replay)
      setStatus('running', s.live ? 'Running' : 'Loading…');
      try {
        const resp = await fetch(`/api/tiger-team/stream?id=${encodeURIComponent(tigerTeamId)}&since=0`);
        if (!resp.ok) { isRunning = false; return false; }
        streamSupported = true;
        await readSSE(resp);
      } catch { /* the network dropped mid-replay: afterStreamEnd follows from the last event drawn */ }
      eventNow = null;
      await afterStreamEnd('Stream ended without a completion event');
      return true;
    }

    // ── Event Handler ──
    // ── Approvals ──
    // A member whose tool needs the owner's OK emits approval_request (and approval_resolved when it is answered, by
    // anyone, or times out). The card is drawn in the member's card (newest first) with Allow / Deny and a countdown.
    // POST /api/approvals/<id> { decision: 'allow' | 'deny' }; a 404 means someone else (or the timeout) answered first.
    const APPROVAL_CLASS_LABELS = { write_outside: 'write outside its folders', send: 'send off this machine', admin: 'change hub data / another agent', destroy: 'destructive action', money: 'move money' };
    const approvalCards = new Map();       // id -> { data, card, settled } for every card on the page (settled = buttons gone)
    const resolvedApprovals = new Set();   // ids already decided: a replay must not offer buttons for them
    let approvalTimer = null;

    function approvalWants(ev) {
      const a = agents[ev.agent];
      const who = (a && a.display) || ev.agent || 'An agent';
      if (ev.cls === 'module') return `${who} needs your OK${ev.detail && ev.detail.module ? ` (${ev.detail.module})` : ''}`;
      const label = APPROVAL_CLASS_LABELS[ev.cls] || String(ev.cls || 'do something that needs approval');
      return `${who} wants to ${ev.cls === 'destroy' ? 'take a ' : ''}${label}`;
    }
    function approvalCountdown(expiresAt) {
      const ms = expiresAt ? Date.parse(expiresAt) - Date.now() : NaN;
      if (!(ms > 0)) return Number.isNaN(ms) ? '' : 'expired: not done';
      const s = Math.ceil(ms / 1000);
      return `expires in ${s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`}`;
    }
    function approvalDecisionText(gw) {
      if (gw.by === 'timeout') return 'Timed out: not done';
      const word = gw.decision === 'allow' ? 'Approved' : 'Denied';
      return gw.by && gw.by !== 'owner' ? `${word} (${gw.by})` : word;
    }
    /** The buttons go and the card says how it was decided. */
    // A settled card stays in approvalCards (flagged), so a recorded approval_resolved that arrives later in a replay
    // still reaches it: the recorded decision overrides an inferred expiry.
    function settleApproval(id, text) {
      const rec = approvalCards.get(id);
      if (!rec) return;
      rec.settled = true;
      rec.card.classList.add('answered');
      rec.card.querySelectorAll('button').forEach(b => b.remove());
      const note = rec.card.querySelector('.approval-note');
      if (note) note.textContent = text;
      const cd = rec.card.querySelector('.approval-countdown');
      if (cd) cd.textContent = '';
      stopApprovalTimerIfIdle();
    }
    function stopApprovalTimerIfIdle() {
      if (approvalTimer && ![...approvalCards.values()].some(r => !r.settled)) { clearInterval(approvalTimer); approvalTimer = null; }
    }
    /** The timeline is being redrawn: forget every card (their DOM is gone) so a replayed request draws again. */
    function resetApprovals() {
      approvalCards.clear(); resolvedApprovals.clear();
      if (approvalTimer) { clearInterval(approvalTimer); approvalTimer = null; }
    }
    function paintApprovalCountdowns() {
      for (const [id, rec] of [...approvalCards]) {
        if (rec.settled) continue;
        const text = approvalCountdown(rec.data.expiresAt);
        if (text === 'expired: not done') { settleApproval(id, 'Timed out: not done'); continue; }
        const el = rec.card.querySelector('.approval-countdown');
        if (el) el.textContent = text;
      }
    }
    async function answerApproval(id, decision) {
      const rec = approvalCards.get(id);
      if (!rec || rec.settled) return;
      const buttons = [...rec.card.querySelectorAll('button')];
      buttons.forEach(b => { b.disabled = true; });
      const note = rec.card.querySelector('.approval-note');
      if (note) note.textContent = 'Sending…';
      try {
        const r = await fetch(`/api/approvals/${encodeURIComponent(id)}`, {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision }),
        });
        if (r.status === 404) { resolvedApprovals.add(id); settleApproval(id, 'Already answered'); return; }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        resolvedApprovals.add(id);
        settleApproval(id, decision === 'allow' ? 'Approved' : 'Denied');
      } catch (e) {
        if (note) note.textContent = `Could not send: ${e.message}`;
        buttons.forEach(b => { b.disabled = false; });
      }
    }
    /** approval_request / approval_resolved from a member's stream (block = its card) or the coordinator's (none). */
    function handleApprovalEvent(gw, block) {
      if (!gw || !gw.id) return;
      if (gw.type === 'approval_resolved') {
        resolvedApprovals.add(gw.id);
        settleApproval(gw.id, approvalDecisionText(gw));
        return;
      }
      if (resolvedApprovals.has(gw.id) || approvalCards.has(gw.id)) return;
      const expired = gw.expiresAt && Date.parse(gw.expiresAt) <= Date.now();
      const card = document.createElement('div');
      card.className = 'approval-card';
      card.dataset.id = String(gw.id);
      const d = gw.detail && typeof gw.detail === 'object' ? gw.detail : null;
      const detail = d ? Object.entries(d).filter(([, v]) => v !== null && v !== undefined && v !== '').map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : String(v)}`).join('\n') : '';
      card.innerHTML = `
        <div class="approval-title">🔐 ${esc(approvalWants(gw))}</div>
        <div class="approval-summary">${esc(gw.summary || '(no summary)')}</div>
        ${detail ? `<pre class="approval-detail">${esc(detail.slice(0, 600))}</pre>` : ''}
        <div class="approval-meta"><span class="approval-countdown">${esc(approvalCountdown(gw.expiresAt))}</span><span class="approval-note"></span></div>
        <div class="approval-actions"><button type="button" class="deny">Deny</button><button type="button" class="allow">Allow</button></div>`;
      if (block && block.element) {
        const body = block.element.querySelector('.agent-block-body');
        body.insertBefore(card, body.firstChild);   // newest first
      } else {
        document.getElementById('timeline').appendChild(card);
      }
      approvalCards.set(gw.id, { data: gw, card });
      if (expired) { settleApproval(gw.id, 'Timed out: not done'); return; }
      card.querySelector('.allow').onclick = () => answerApproval(gw.id, 'allow');
      card.querySelector('.deny').onclick = () => answerApproval(gw.id, 'deny');
      if (!approvalTimer) approvalTimer = setInterval(paintApprovalCountdowns, 1000);
      scrollBottom();
    }

    // ── Download cards ──
    // Files a reply names (lib/ui-file-card.js, window.hubFileCard) get a card each in a .file-cards box after the text.
    // No candidates, no request; nothing here may throw into the page.
    async function attachFileCards(block) {
      try {
        const H = window.hubFileCard;
        if (!H || !block || !block.textEl || !block.textEl.isConnected) return;
        const cands = H.candidatesFrom(block.textEl, { agent: block.slug ? String(block.slug) : null });
        if (!cands || !cands.length) return;
        const results = await H.resolveBatch((u, o) => fetch(u, o), cands);
        if (!block.textEl.isConnected) return;
        const html = results.map(r => (r && r.ok ? H.cardHtml(r, { esc }) : '')).join('');
        const old = block.textEl.nextElementSibling;
        if (old && old.classList.contains('file-cards')) old.remove();
        if (!html) return;
        const box = document.createElement('div');
        box.className = 'file-cards';
        box.innerHTML = html;
        block.textEl.after(box);
      } catch (e) { /* the cards are a convenience: the reply itself is already shown */ }
    }

    function handleEvent(evt) {
      if (!evt || typeof evt !== 'object') return;
      // Numbered events (a hub with live replay): draw each once, even when a reconnect's replay overlaps.
      if (evt.tt_seq) { if (evt.tt_seq <= lastSeq) return; lastSeq = evt.tt_seq; }
      eventNow = evt.tt_at ? Date.parse(evt.tt_at) : null;
      if (eventNow && !clockSet) { startTime = eventNow; clockSet = true; }
      const gw = evt.gateway;
      // A member's own events (its text, tools and notices) carry its dispatch (tt_call) and go to its card.
      // The coordinator's events, and every event from an older hub, take the single-card path below.
      const member = evt.tt_call && (evt.tt_role === 'participant' || evt.tt_role === 'challenger')
        ? callBlock(evt.tt_call, evt.tt_agent, evt.tt_role === 'challenger' ? 'Challenger' : 'Participant') : null;

      if (gw && (gw.type === 'approval_request' || gw.type === 'approval_resolved')) { handleApprovalEvent(gw, member); return; }

      if (gw && member) {
        switch (gw.type) {
          case 'tool_start':
            if (gw.tool !== 'consult_agent') addTool(gw.tool, toolKey(evt, gw), gw.input, member);
            return;
          case 'tool_use': {
            const entry = toolMap.get(toolKey(evt, gw)) || {};
            const line = entry.line;
            if (line && gw.input) setMemberStep(member.slug, toolStepText(entry.name || gw.tool, gw.input));
            if (line && gw.input) {
              let inputEl = line.querySelector('.tool-call-input');
              if (!inputEl) { const info = line.querySelector('.tool-call-info'); if (info) { inputEl = document.createElement('span'); inputEl.className = 'tool-call-input'; info.appendChild(inputEl); } }
              if (inputEl) inputEl.textContent = String(gw.input).slice(0, 100);
            }
            return;
          }
          case 'tool_result':
            completeTool(toolKey(evt, gw), gw.output);
            return;
          case 'tt_member_notice':
            addBlockNote(member, '⏳ ' + (gw.message || ''), 'waiting');
            setMemberState(member.slug, 'waiting', noticeStepText(gw.message));
            return;
          case 'auto_model': {
            const badge = document.createElement('span');
            badge.className = 'auto-model-badge';
            badge.textContent = (gw.model || '').split('/').pop();
            badge.style.cssText = 'font-size:11px;color:var(--tt-model);opacity:0.8;margin-left:8px;font-weight:normal;';
            const name = member.element.querySelector('.block-agent');
            if (name) name.appendChild(badge);
            return;
          }
        }
      }

      if (gw) {
        switch (gw.type) {
          case 'tt_session':
            sessionId = gw.session_id;
            if (!saveKey) saveKey = String(gw.session_id).replace(/^(auto_)+/, '');
            break;

          case 'tt_started':
            if (gw.tiger_team_id) {
              tigerTeamId = gw.tiger_team_id;
              if (backendRecoveryAvailable) {
              // Persist the canonical tigerTeamId into the URL so a refresh
              // loads THIS prior investigation via ?load=<id> instead of
              // blindly launching a brand-new one from the original params.
              try {
                const url = new URL(window.location.href);
                url.searchParams.set('load', tigerTeamId);
                url.searchParams.delete('launch');
                history.replaceState(null, '', url.toString());
              } catch (e) { console.warn('URL update failed:', e); }
              }
            }
            if (tigerTeamId && backendRecoveryAvailable) saveKey = tigerTeamId;
            else if (!saveKey) saveKey = String(sessionId || '').replace(/^(auto_)+/, '') || null;
            startAutoSave();
            // A run (re)started: whatever an earlier interruption showed no longer applies.
            document.getElementById('tt-error-banner').style.display = 'none';
            document.getElementById('btn-resume').style.display = 'none';
            setStatus('running', 'Running');
            setRunning(true);
            if (mode === 'roundtable') {
              addSystemMsg('Participants: ' + [gw.coordinator_display, ...(gw.participant_names || [])].join(', '));
            } else {
              let teamInfo = 'Coordinator: ' + gw.coordinator_display + '  ·  Team: ' + (gw.participant_names || []).join(', ');
              if (gw.challenger_display) teamInfo += '  ·  ⚔️ Challenger: ' + gw.challenger_display;
              addSystemMsg(teamInfo);
              const displayMax = (gw.max_rounds >= 50 || maxRounds === 0) ? '∞' : (gw.max_rounds || maxRounds);
              document.getElementById('round-counter').textContent = (gw.max_rounds === 0 || maxRounds === 0) ? 'Round 0' : 'Round 0 of ' + displayMax;
            }
            break;

          case 'tt_coordinator_start':
            if (!currentBlock || currentBlock.slug !== coordinator) {
              openBlock(coordinator, 'Coordinator');
            }
            break;

          case 'auto_model':
            // Show which model was auto-selected for this agent
            let targetBlock = currentBlock;
            if (!targetBlock) {
              // If currentBlock is null, find the most recent agent block for this agent
              const recentBlocks = Array.from(document.querySelectorAll('.agent-block'));
              if (recentBlocks.length > 0) {
                const lastBlock = recentBlocks[recentBlocks.length - 1];
                const agentName = lastBlock.querySelector('.block-agent')?.textContent || '';
                // Get the agent name from the event or use the most recent block
                targetBlock = { element: lastBlock };
              }
            }
            if (targetBlock && targetBlock.element) {
              const modelBadge = document.createElement('span');
              modelBadge.className = 'auto-model-badge';
              modelBadge.textContent = (gw.model || '').split('/').pop();
              modelBadge.style.cssText = 'font-size:11px;color:var(--tt-model);opacity:0.8;margin-left:8px;font-weight:normal;';
              const blockAgent = targetBlock.element.querySelector('.block-agent');
              if (blockAgent) blockAgent.appendChild(modelBadge);
            }
            break;

          case 'tt_round_start':
            const rMax = gw.max_rounds >= 50 ? '∞' : gw.max_rounds;
            addDivider('Round ' + gw.round + ' of ' + rMax, 'round');
            document.getElementById('round-counter').textContent = 'R' + gw.round + '/' + rMax;
            break;

          case 'tt_round_complete':
            closeBlock();
            break;

          case 'tt_dispatch':
            // Update turn counter for Led mode
            if (mode !== 'roundtable' && (gw.round || gw.turn) && gw.max_rounds) {
              const dMax = gw.max_rounds >= 50 ? '∞' : gw.max_rounds;
              document.getElementById('round-counter').textContent = 'Round ' + (gw.round || gw.turn) + ' of ' + dMax;
            } else if (mode !== 'roundtable' && (gw.round || gw.turn) && gw.max_rounds === 0) {
              document.getElementById('round-counter').textContent = 'Round ' + (gw.round || gw.turn);   // no limit: no "of M"
            }
            // If coordinator block is empty (no text and no tool calls), remove it entirely
            if (currentBlock && currentBlock.slug === coordinator && !currentBlock.rawText.trim() && !currentBlock.toolCount) {
              setDot(currentBlock.slug, 'done');   // its turn ended in the hand-out: from here it waits for the team
              currentBlock.element.remove();
              currentBlock = null;
            } else {
              closeBlock();
            }
            if (gw.call_key) {
              // This dispatch's own card; members dispatched together all work at once, each in its card.
              // A dispatch that runs again (Resume after a stop) gets a fresh card; the finished one stays as history.
              if (callBlocks.has(gw.call_key) && callBlocks.get(gw.call_key).done) callBlocks.delete(gw.call_key);
              const b = callBlock(gw.call_key, gw.agent, gw.role === 'challenger' ? 'Challenger' : 'Participant');
              if (gw.task && !b.taskShown) { b.taskShown = true; addBlockNote(b, 'Task: ' + String(gw.task).replace(/\s+/g, ' ').slice(0, 200) + (String(gw.task).length > 200 ? '…' : ''), 'task'); }
            } else {
              openBlock(gw.agent, 'Participant');   // an older hub: one member at a time, in the newest card
            }
            break;

          case 'tt_dispatch_complete':
            if (gw.call_key && callBlocks.has(gw.call_key)) finishCallBlock(callBlocks.get(gw.call_key));
            else { closeBlock(); setDot(gw.agent, 'done'); }
            autoSave(); // Save after each participant completes
            // Don't eagerly open coordinator block - wait for actual content
            // It will open on-demand when text or tools arrive
            break;

          case 'tt_dispatch_failed': {
            // One member could not do its part; the coordinator was told why and carries on.
            const b = callBlock(gw.call_key, gw.agent, 'Participant');
            // When the member's own reply already explains the error, one line says how it ended; else the reason too.
            const who = gw.agent_display || gw.agent;
            addBlockNote(b, b.rawText.trim() ? `✗ ${who} could not finish this task.` : `✗ ${who} could not finish this task. ${gw.error || ''}`.trim(), 'failed');
            finishCallBlock(b, true);
            autoSave();
            break;
          }

          case 'worker_failed':
            // A member's turn ended because the team is stopping (or its journal failed): close its card as such.
            if (gw.call_key && callBlocks.has(gw.call_key)) {
              const b = callBlocks.get(gw.call_key);
              if (!b.done) { addBlockNote(b, gw.error === 'Stopped' ? '■ Stopped' : '■ Ended: ' + (gw.error || 'stopped'), 'failed'); finishCallBlock(b, true); }
            }
            break;

          case 'tt_user_message': {
            // An interjection: drawn by the page that sent it; any other page (or a replay) draws it from here.
            const mine = sentInterjections.indexOf(gw.message);
            if (mine !== -1) { sentInterjections.splice(mine, 1); break; }
            closeBlock();
            const block = document.createElement('div');
            block.className = 'agent-block user-inject';
            block.innerHTML = `
              <div class="agent-block-header">
                <span class="block-icon">👤</span>
                <span class="block-agent">You</span>
                <span class="block-role">${gw.kind === 'continuation' ? 'Continuation' : gw.kind === 'resume_note' ? 'Note' : 'Interjection'}${gw.target && gw.target !== 'team' ? ' → ' + esc((agents[gw.target] && agents[gw.target].display) || gw.target) : ''}</span>
                <span class="block-time">${stamp()}</span>
              </div>
              <div class="agent-block-body"><div class="text-content">${md(gw.message || '')}</div><div class="interject-status" style="font-size:11px;color:var(--text-dim);margin-top:4px"></div></div>`;
            const who = (gw.delivered || []).map(d => `${d.agent} (${d.how === 'live' ? 'now' : 'at its next step'})`).join(', ');
            block.querySelector('.interject-status').textContent = who ? 'sent to ' + who : 'sent';
            document.getElementById('timeline').appendChild(block);
            lastInterjectBlock = block;
            scrollBottom();
            break;
          }

          case 'tt_state':
            // The end of a replay of a team that is not running: how it ended, when no final event said so
            // (a hub restart mid-run leaves none).
            if (!isRunning) break;
            if (gw.status === 'completed') {
              closeBlock(); finalizeAllTools(); setStatus('complete', 'Complete'); setRunning(false); stopAutoSave();
              document.title = '✅ Tiger Team - Complete';
              document.getElementById('btn-save').disabled = false;
              showContinueUI();
            } else {
              handleEvent({ gateway: { type: 'tt_interrupted', status: gw.status, message: gw.error || ('Not running (' + gw.status + ')') } });
            }
            break;

          case 'interjection_received': {
            // An agent picked the interjection up: say who and when, under the interjection it belongs to.
            const who = gw.agent || 'agent';
            const st = lastInterjectBlock && lastInterjectBlock.querySelector('.interject-status');
            if (st) { st.textContent = (st.textContent.replace(/ · waiting for pickup…$/, '') + ` · ✓ ${who} picked it up ${elapsed()}`).replace(/^sending…/, 'sent'); st.style.color = 'var(--tt-green)'; }
            else addSystemMsg(`✓ ${who} picked up the interjection`);
            break;
          }

          case 'tt_request_rounds':
            closeBlock();
            showRoundsApproval(gw.justification, gw.proposed_rounds || 3);
            break;

          case 'tt_verdict':
            // Notify dashboard via localStorage cross-tab communication
            localStorage.setItem('panther_verdict_update', JSON.stringify({ alert_id: gw.alert_id, verdict: gw.verdict, ts: Date.now() }));
            break;

          case 'tt_soft_close':
            // Notify dashboard about soft-closed related alerts
            localStorage.setItem('panther_verdict_update', JSON.stringify({ alert_ids: gw.alert_ids, verdict: 'soft_close', reason: gw.reason, source_alert: gw.source_alert, ts: Date.now() }));
            addSystemMsg(`↳ Soft-closed ${gw.alert_ids.length} related alert(s): ${gw.alert_ids.join(', ')} — ${gw.reason}`);
            break;

          case 'tt_complete':
            document.getElementById('btn-resume').style.display = 'none';
            document.getElementById('tt-error-banner').style.display = 'none';
            document.getElementById('tt-retry-banner').style.display = 'none';
            closeBlock();
            finalizeAllTools();
            setStatus('complete', 'Complete');
            setRunning(false);
            stopAutoSave();
            addDivider(gw.reason || 'Session Complete', 'complete');
            document.title = '✅ Tiger Team - Complete';
            document.getElementById('btn-save').disabled = false;
            showContinueUI();
            // Also notify dashboard that TT completed
            const alertId = new URLSearchParams(window.location.search).get('alert_id');
            if (alertId) localStorage.setItem('panther_tt_complete', JSON.stringify({ alert_id: alertId, ts: Date.now() }));
            break;

          case 'tt_notice':
          case 'notice':
            addSystemMsg(gw.message || '');
            break;

          case 'tt_error':
            // The run ended: a member card still open ends with it (else its chip, and the coordinator's
            // "waiting for the team", would stay as if it still worked).
            for (const b of callBlocks.values()) if (!b.done) { addBlockNote(b, '■ Ended', 'failed'); finishCallBlock(b, true); }
            markUnfinishedTools();
            closeBlock();
            setStatus('error', 'Error');
            setRunning(false);
            setInputMode('ended');   // a failed run is resumed (with an optional note), never "continued" as if it had finished
            stopAutoSave();
            addSystemMsg('Error: ' + gw.message);
            document.title = '❌ Tiger Team - Error';
            {
              const banner = document.getElementById('tt-error-banner');
              banner.textContent = '⚠ ' + gw.message;
              banner.style.display = 'block';
            }
            // tt_error must NEVER be treated as a successful completion - do
            // NOT call showContinueUI() here.  Offer Resume instead, since
            // the run ended in a blocked/failed state, not a clean finish.
            if (tigerTeamId && backendRecoveryAvailable) {
              document.getElementById('btn-resume').style.display = 'inline-flex';
              document.getElementById('btn-resume').disabled = false;
              document.getElementById('btn-resume').textContent = '▶ Resume Interrupted';
            }
            break;

          // Interrupted mid-stream (disconnect grace window expired server-side,
          // or the stream otherwise ended abnormally).  Explicitly distinct from
          // tt_complete - must never render as success.
          case 'tt_interrupted': {
            const stopped = gw.status === 'stopped';   // ended by Stop, not by a failure
            // Every member card still open ends here (a roundtable turn or a challenger has no failure event of its
            // own), so a Resume opens fresh cards and its tools left running read "unknown", not "Done".
            for (const b of callBlocks.values()) if (!b.done) { addBlockNote(b, stopped ? '■ Stopped' : '■ Interrupted', 'failed'); finishCallBlock(b, true); }
            markUnfinishedTools();
            closeBlock();
            setStatus('error', gw.status === 'blocked' ? 'Needs attention' : stopped ? 'Stopped' : 'Interrupted');
            const errorBanner = document.getElementById('tt-error-banner');
            errorBanner.textContent = stopped ? 'Stopped. Everything so far is saved; Resume carries on from here.' : (gw.message || gw.reason || 'Connection interrupted');
            errorBanner.style.display = 'block';
            setRunning(false);
            setInputMode('ended');
            stopAutoSave();
            addDivider(stopped ? 'Session Stopped' : (gw.reason || 'Session Interrupted'), '');
            if (stopped) addSystemMsg('■ Stopped. Prior progress was checkpointed - use Resume to continue.');
            else addSystemMsg('⚠ Session interrupted: ' + (gw.message || gw.reason || 'connection lost or process restarted') + '. Prior progress was checkpointed - use Resume to continue.');
            document.title = stopped ? '⏹ Tiger Team - Stopped' : '⏸ Tiger Team - Interrupted';
            if (tigerTeamId && backendRecoveryAvailable) {
              document.getElementById('btn-resume').style.display = 'inline-flex';
              document.getElementById('btn-resume').disabled = false;
              document.getElementById('btn-resume').textContent = stopped ? '▶ Resume' : '▶ Resume Interrupted';
            }
            break;
          }

          // Coordinator/dispatch is retrying a failed call - surface it so the
          // user knows the system is working the problem, not silently stuck.
          case 'tt_retry':
            {
              const banner = document.getElementById('tt-retry-banner');
              const delaySec = gw.delay_ms ? Math.round(gw.delay_ms / 1000) : null;
              banner.textContent = `↻ Retrying (attempt ${gw.attempt || '?'}${delaySec ? `, waiting ${delaySec}s` : ''}): ${gw.message || 'transient error'}`;
              banner.style.display = 'block';
              setTimeout(() => { banner.style.display = 'none'; }, 8000);
            }
            addSystemMsg(`↻ Retry attempt ${gw.attempt || '?'}: ${gw.message || 'transient error'}`);
            break;

          case 'tool_start':
            // Skip consult_agent tool events - they're redundant with tt_dispatch
            if (gw.tool === 'consult_agent') {
              if (gw.tool_call_id) skipToolIds.add(toolKey(evt, gw));
              break;
            }
            if (!currentBlock) openBlock(coordinator, 'Coordinator');
            addTool(gw.tool, toolKey(evt, gw), gw.input);
            break;

          case 'tool_use':
            // Update tool input display (tool_use carries the input summary)
            if (gw.tool === 'consult_agent') break;
            if (!currentBlock) break;
            const toolEntry = toolMap.get(toolKey(evt, gw)) || {};
            const toolLine = toolEntry.line;
            if (toolLine && gw.input) setMemberStep(currentBlock.slug, toolStepText(toolEntry.name || gw.tool, gw.input));
            if (toolLine && gw.input) {
              let inputEl = toolLine.querySelector('.tool-call-input');
              if (!inputEl) {
                const infoEl = toolLine.querySelector('.tool-call-info');
                if (infoEl) {
                  inputEl = document.createElement('span');
                  inputEl.className = 'tool-call-input';
                  infoEl.appendChild(inputEl);
                }
              }
              if (inputEl) inputEl.textContent = String(gw.input).slice(0, 100);
            }
            break;

          case 'tool_result':
            // Skip consult_agent results - represented by tt_dispatch_complete
            if (skipToolIds.has(toolKey(evt, gw))) {
              skipToolIds.delete(toolKey(evt, gw));
              break;
            }
            completeTool(toolKey(evt, gw), gw.output);
            break;
        }
      }

      // Text deltas
      const content = evt.choices?.[0]?.delta?.content;
      if (content) {
        if (member) { appendBlockText(content, member); return; }
        if (!currentBlock) openBlock(coordinator, 'Coordinator');
        appendBlockText(content);
      }
    }

    // ── Phone: the header, the More menu, the input box ──
    /** The mission in the header: one line on a phone (a tap expands it); the full text is also its title. */
    function showObjective(text) {
      const el = document.getElementById('objective-text');
      el.textContent = text;
      if (el.parentElement) el.parentElement.title = String(text || '');
    }
    /** The phone's "More" menu: Save, Resolve unknowns, Full record and Load behind one small button. */
    function setMoreMenu(open) {
      const menu = document.getElementById('tt-more'), btn = document.getElementById('btn-more');
      if (!menu || !btn) return;
      menu.classList.toggle('open', !!open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    function toggleMoreMenu(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      setMoreMenu(!document.getElementById('tt-more').classList.contains('open'));
    }
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('tt-more');
      if (menu && menu.classList.contains('open') && !(e.target && e.target.closest && e.target.closest('#tt-more'))) setMoreMenu(false);
      else if (menu && menu.classList.contains('open') && e.target.closest('button')) setMoreMenu(false);   // a choice closes it
    });
    /** The input box grows with what is typed, up to 3 lines (then it scrolls); the page keeps room under the fixed bar. */
    function growInput() {
      const input = document.getElementById('user-input');
      if (!input || !input.style) return;
      input.style.height = 'auto';
      const max = 3 * 1.4 * (parseFloat(getComputedStyle(input).fontSize) || 13) + 18;
      input.style.height = Math.min(input.scrollHeight + 2, max) + 'px';
    }
    function syncInputPad() {
      const bar = document.getElementById('input-bar');
      if (bar) document.documentElement.style.setProperty('--input-h', bar.offsetHeight + 'px');
    }
    document.getElementById('user-input').addEventListener('input', () => { growInput(); syncInputPad(); });
    if (typeof ResizeObserver === 'function') new ResizeObserver(syncInputPad).observe(document.getElementById('input-bar'));
    window.addEventListener('resize', syncInputPad);

    // ── The Teams list (the phone app's way in: /tiger-team?from=mobile with no team to open) ──
    // GET /api/tiger-team/list gives { sessions: [{ id, status, objective, completed_at, ... }] }: running teams first, then the rest.
    const TEAM_LIVE_STATUSES = ['running', 'retrying', 'stopping'];
    function teamTimeText(iso) {
      const ms = iso ? Date.parse(iso) : NaN;
      if (!Number.isFinite(ms)) return '';
      return 'ended ' + new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + clockTime(ms);
    }
    function teamsListHTML(sessions) {
      const rows = (Array.isArray(sessions) ? sessions : []).filter(s => s && s.id);
      const live = s => TEAM_LIVE_STATUSES.includes(s.status);
      const endedAt = s => { const ms = s.completed_at ? Date.parse(s.completed_at) : NaN; return Number.isFinite(ms) ? ms : 0; };
      rows.sort((a, b) => (live(b) - live(a)) || (endedAt(b) - endedAt(a)));   // running first, then the latest finished
      if (!rows.length) return '<div class="teams-home"><h2>Teams</h2><div class="teams-empty">No Tiger Teams yet.</div></div>';
      return '<div class="teams-home"><h2>Teams</h2>' + rows.map(s => {
        const cls = live(s) ? 'running' : s.status === 'completed' ? 'completed' : 'problem';
        const when = live(s) ? 'running now' : teamTimeText(s.completed_at);
        return `<a class="team-row" href="/tiger-team?load=${esc(encodeURIComponent(s.id))}&amp;from=mobile">` +
          `<div class="team-top"><span class="team-chip ${cls}">${esc(s.status || 'unknown')}</span><span class="team-time">${esc(when)}</span></div>` +
          `<div class="team-obj">${esc(s.objective || '(no objective)')}</div></a>`;
      }).join('') + '</div>';
    }
    async function showTeamsHome() {
      document.body.classList.add('teams-view');
      showObjective('Tiger Teams');
      setStatus('complete', 'Teams');
      const tl = document.getElementById('timeline');
      tl.innerHTML = '<div class="teams-home"><h2>Teams</h2><div class="teams-empty">Loading…</div></div>';
      try {
        const r = await fetch('/api/tiger-team/list');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        tl.innerHTML = teamsListHTML((await r.json()).sessions);
      } catch (e) {
        tl.innerHTML = `<div class="teams-home"><h2>Teams</h2><div class="teams-empty">Could not load the teams: ${esc(e.message)}</div></div>`;
      }
    }

    // Enter key sends (Shift+Enter makes a new line); Enter that confirms an input-method candidate (Japanese, Chinese,
    // Korean keyboards) is not a send.
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('btn-send').click(); }
    });
    // Escape closes the More menu and gives the focus back to its button.
    document.addEventListener('keydown', (e) => {
      const menu = document.getElementById('tt-more');
      if (e.key === 'Escape' && menu && menu.classList.contains('open')) { setMoreMenu(false); const b = document.getElementById('btn-more'); if (b && b.focus) b.focus(); }
    });
    // A sent note empties the box without an input event: shrink it back afterwards.
    document.getElementById('btn-send').addEventListener('click', () => setTimeout(() => { growInput(); syncInputPad(); }, 0));

    // ── Save Session ──
    let loadedSaveId = null;
    let loadedSaveTitle = null;

    async function saveSession() {
      const timeline = document.getElementById('timeline');
      const transcript = timeline.innerHTML;
      // If loaded from existing save, overwrite it directly (no prompt)
      let title = loadedSaveTitle;
      let saveId = loadedSaveId;
      if (!saveId) {
        title = prompt('Name this investigation:', objectiveText?.slice(0, 80) || 'Untitled');
        if (!title) return;
      }
      try {
        const resp = await fetch('/api/tiger-team/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            save_id: saveId || undefined,
            title,
            objective: objectiveText,
            coordinator,
            participants,
            transcript,
            mode,
          })
        });
        const data = await resp.json();
        if (data.ok) {
          // Track the save ID so subsequent saves also overwrite
          loadedSaveId = data.id;
          loadedSaveTitle = title;
          addSystemMsg(`💾 Session saved as "${title}"`);
        } else {
          addSystemMsg('Save failed: ' + (data.error || 'Unknown error'));
        }
      } catch (e) { addSystemMsg('Save failed: ' + e.message); }
    }

    // ── Load Saved Panel ──
    let savedPanelOpen = false;
    // Every way the saved-sessions panel goes away (✕, Esc, the backdrop, choosing a session) also tells the dialog
    // guard, so a hidden panel never stays the top layer.
    function closeSavedPanel() {
      const panel = document.getElementById('saved-panel');
      panel.style.display = 'none';
      savedPanelOpen = false;
      if (window.dialogGuard) dialogGuard.closed(panel);
    }
    async function toggleSavedPanel() {
      const panel = document.getElementById('saved-panel');
      if (savedPanelOpen) { closeSavedPanel(); return; }
      panel.style.display = 'block';
      savedPanelOpen = true;
      if (window.dialogGuard) dialogGuard.open(panel, { close: closeSavedPanel });   // Esc and the backdrop close it (lib/ui-dialog.js)
      const list = document.getElementById('saved-list');
      list.innerHTML = 'Loading...';
      try {
        const resp = await fetch('/api/tiger-team/saved');

            : s.status === 'in_progress'

            : s.auto_saved 
              ? '<span style="background:var(--tt-ok2-20); color:var(--tt-ok2); padding:1px 6px; border-radius:3px; font-size:10px; margin-left:8px;">AUTO-SAVED</span>'
              : '';
          return `
          <div style="border:1px solid var(--border); border-radius:6px; padding:12px; cursor:pointer; transition:border-color 0.2s;" 
               onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'"
               onclick="openSaved('${esc(s.id)}')">

            </div>
            <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">${esc(s.objective || '')}</div>
            <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">👑 ${esc(s.coordinator)} · 👥 ${esc((s.participants||[]).join(', '))}</div>
            <button onclick="event.stopPropagation(); deleteSaved('${esc(s.id)}', this.closest('div[style*=border]'))"
                    style="margin-top:8px; background:none; border:1px solid var(--tt-err-30); color:var(--error); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:11px;">🗑 Delete</button>
          </div>`;

    async function reconcileUnknownOutcomes() {
      if (!tigerTeamId || isRunning) { alert('Load a stopped investigation first.'); return; }
      try {
        const status = await fetch('/api/tiger-team/status?id=' + encodeURIComponent(tigerTeamId));
        const data = await status.json();
        if (!status.ok) throw new Error(data.error || 'Status failed');
        if (!data.unresolved?.length) { alert('No uncertain tool outcomes.'); return; }
        for (const tool of data.unresolved) {
          const label = tool.name + ' [' + tool.callKey + ' / ' + tool.toolId + ']';
          const evidence = prompt('Verify this operation outside the agent before continuing: ' + label + '\nEnter how you verified its actual outcome (Cancel leaves it blocked):');
          if (!evidence?.trim()) return;
          const result = prompt('Enter the verified result for ' + label + '.  This is recorded as operator-supplied evidence, not a rerun:');
          if (!result?.trim()) return;
          if (!confirm('Record this verified outcome and allow Resume?\n' + label + '\n' + result)) return;
          const resp = await fetch('/api/tiger-team/reconcile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: tigerTeamId, callKey: tool.callKey, toolId: tool.toolId, result, evidence }) });
          const saved = await resp.json();
          if (!resp.ok) throw new Error(saved.error || 'Reconciliation failed');
        }
        addSystemMsg('Verified outcomes recorded.  Resume is available.  No tools were replayed.');
      } catch (e) { alert(e.message); }
    }

    function downloadFullRecord() {
      if (!tigerTeamId) { alert('Start or load an investigation first.'); return; }
      const link = document.createElement('a');
      link.href = '/api/tiger-team/archive/' + encodeURIComponent(tigerTeamId) + '?download=1';
      link.download = tigerTeamId + '-full-record.json';
      link.click();
    }

    /** A saved session from the list: redrawn from its own events when it has them, else its saved transcript. */
    async function openSaved(id) {
      if (isRunning) { window.open('/tiger-team?load=' + encodeURIComponent(id), '_blank'); return; }   // this page follows a running team
      closeSavedPanel();
      if (await loadTeam(id)) return;
      await loadSaved(id);
    }

    async function loadSaved(id) {
      try {
        const resp = await fetch(`/api/tiger-team/saved/${id}`);
        const data = await resp.json();
        if (!resp.ok) { alert(data.error || 'Load failed'); return; }
        
        // Restore UI state
        closeSavedPanel();
        
        // Set header
        objectiveText = data.objective;
        showObjective(data.objective || '');
        const status = data.status || 'complete';
        const statusLabelMap = { completed: 'Complete', running: 'Running elsewhere', retrying: 'Retrying', stopping: 'Stopping', complete: 'Loaded', interrupted: 'Interrupted', stopped: 'Stopped', blocked: 'Blocked', in_progress: 'In Progress (stale)' };
        const statusClassMap = { completed: 'complete', running: 'running', retrying: 'running', stopping: 'error', complete: 'complete', interrupted: 'error', stopped: 'error', blocked: 'error', in_progress: 'error' };
        document.getElementById('status-badge').textContent = statusLabelMap[status] || 'Loaded';
        document.getElementById('status-badge').className = 'status-badge ' + (statusClassMap[status] || 'complete');
        
        // Restore roster
        coordinator = data.coordinator;
        mode = data.mode || 'led';
        participants = data.participants || [];
        memberStates.clear();   // a saved transcript has no events to rebuild the members' steps from
        buildRoster();
        
        // Restore transcript.  Durable-only entries (recovered from a
        // checkpoint with no legacy HTML save) have no `transcript` HTML -
        // render plainTranscript safely as escaped/markdown text instead of
        // assuming HTML is present.
        const timeline = document.getElementById('timeline');
        resetApprovals();   // the DOM is about to be replaced: no card of the old draw is still there
        if (data.transcript && data.transcript.trim()) {
          const rawTranscript = data.transcript;
          if (purifyReady()) {
            // No inline handlers survive a save: the "▶ output" toggles work through the delegated
            // listener (data-call-id, else the sibling result block); approval buttons are history.
            ensurePurifyHook();   // the same img/link rules as live text
            timeline.innerHTML = DOMPurify.sanitize(rawTranscript, {
              ADD_ATTR: ['target','rel','class','data-call-id'],
              FORBID_TAGS: ['script','iframe','object','embed','form','input','textarea','select','style'],
              FORBID_ATTR: ['id','name','style','onerror','onload','onclick','onmouseover','onfocus','onblur','onmouseenter','onanimationend']
            });
          } else {
            timeline.textContent = rawTranscript;   // fail closed: no sanitizer, no HTML
          }
        } else if (data.plainTranscript && data.plainTranscript.trim()) {
          // Text/markdown-safe render - never trust this as raw HTML.
          if (purifyReady()) timeline.innerHTML = md(data.plainTranscript);
          else timeline.textContent = data.plainTranscript;
        } else {
          timeline.innerHTML = '<p style="color:var(--text-dim);">No transcript data.</p>';
        }
        
        // Set session IDs so continue/resume work
        tigerTeamId = data.tiger_team_id || (data.durable ? data.session_id : null) || id;
        sessionId = id;
        // Stable save key: original session_id if present, else id stripped of auto_ prefixes
        saveKey = String(data.session_id || id).replace(/^(auto_)+/, '');
        // Track loaded save so Save button overwrites same file
        loadedSaveId = id;
        loadedSaveTitle = data.title;
        if (backendRecoveryAvailable) {
          const url = new URL(window.location.href);
          url.searchParams.set('load', tigerTeamId); url.searchParams.delete('launch');
          history.replaceState(null, '', url.toString());
        }
        
        const btn = document.getElementById('btn-send');
        const input = document.getElementById('user-input');
        const label = document.querySelector('.input-label');
        const resumeBtn = document.getElementById('btn-resume');
        document.getElementById('btn-save').disabled = false;

        if (['interrupted', 'stopped', 'blocked', 'running', 'retrying', 'stopping', 'in_progress'].includes(status)) {
          // Offer Resume for anything that did not reach a clean completion: the same mode a live run ends in.
          setInputMode('ended');
          resumeBtn.style.display = backendRecoveryAvailable ? 'inline-flex' : 'none';
          if (data.error) {
            const banner = document.getElementById('tt-error-banner');
            banner.textContent = '⚠ ' + data.error;
            banner.style.display = 'block';
          }
        } else {
          // Completed (or legacy in_progress with no durable status) - normal continue flow.
          resumeBtn.style.display = 'none';
          setInputMode('complete');
        }
        
        addSystemMsg(`📂 Loaded saved session: "${data.title}"${data.durable ? ' (recovered from checkpoint)' : ''}`);
      } catch (e) { alert('Load failed: ' + e.message); }
    }

    // ── Resume Interrupted Team ──
    // GET /status first to avoid a duplicate launch if the team turns out to
    // already be running (e.g. two tabs open on the same investigation).
    // No automatic retry on failure - resume outcome is ambiguous if the
    // request fails mid-flight, so the user must explicitly click again.
    async function resumeInterruptedTeam(note) {
      note = typeof note === 'string' ? note.trim() : '';   // the button's click passes an event, not a note
      if (!tigerTeamId || continuationInFlight) return;
      const resumeBtn = document.getElementById('btn-resume');
      resumeBtn.disabled = true;
      resumeBtn.textContent = '⏳ Checking status...';
      document.getElementById('tt-error-banner').style.display = 'none';
      // While the status is checked the box is locked, so the note being sent is exactly what is in it. A team that turned out
      // to be finished or running elsewhere redraws the page; the unsent note is then put back with a line saying so.
      const draftBox = document.getElementById('user-input'), draftBtn = document.getElementById('btn-send');
      const wasLocked = draftBox.disabled;
      if (note) { draftBox.disabled = true; draftBtn.disabled = true; }
      const unlockDraft = () => { if (note) { draftBox.disabled = wasLocked; draftBtn.disabled = wasLocked; } };
      const keepDraft = (why) => { if (!note) return; if (!draftBox.value.trim()) { draftBox.value = note; if (typeof growInput === 'function') growInput(); } addSystemMsg(why); };   // never over text typed since

      try {
        const statusResp = await fetch(`/api/tiger-team/status?id=${encodeURIComponent(tigerTeamId)}`);
        if (statusResp.status === 404) {
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          addSystemMsg('No saved recovery state was found for this investigation.  Try loading its latest saved session.');
          unlockDraft();
          return;
        }
        if (!statusResp.ok) throw new Error('Status check HTTP ' + statusResp.status);
        const statusData = await statusResp.json();
        if (statusData.id) tigerTeamId = statusData.id;
        if (statusData.status === 'completed') {
          if (!(await loadTeam(tigerTeamId))) await loadSaved(tigerTeamId);
          keepDraft('This team finished in another window, so your note was not sent. It is back in the box: send it to continue the team.');
          return;
        }
        if (statusResp.ok && ['running', 'retrying', 'stopping'].includes(statusData.status)) {
          // Still working (a closed page no longer stops a team): follow it instead of starting a second run.
          // With a note waiting, the page does not start following (that would redraw it and could later clear the box):
          // the note stays in the box and the person reloads to follow the team.
          if (note && statusData.has_stream) {
            unlockDraft(); draftBox.value = note; if (typeof growInput === 'function') growInput(); const kept = keepUnsentNote(note);
            resumeBtn.disabled = false; resumeBtn.textContent = '▶ Resume Interrupted';
            addSystemMsg(kept
              ? 'The team is already running again (from another window), so your note was not sent. It is still in the box, and it will be back in the box after you reload this page to follow the team; then send it as an interjection.'
              : 'The team is already running again (from another window), so your note was not sent. It is still in the box: copy it before you reload this page to follow the team (this browser could not keep it), then send it as an interjection.');
            return;
          }
          resumeBtn.style.display = 'none';
          if (statusData.has_stream && await loadTeam(tigerTeamId)) return;
          addSystemMsg('⚠ This Tiger Team is already running elsewhere - not launching a duplicate. Check other open tabs.');
          resumeBtn.style.display = 'inline-flex';
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          unlockDraft();
          return;
        }
      } catch (e) {
        addSystemMsg('Status check failed: ' + e.message + ' - resume aborted (no automatic retry).');
        resumeBtn.disabled = false;
        resumeBtn.textContent = '▶ Resume Interrupted';
        unlockDraft();
        return;
      }

      continuationInFlight = true;
      resumeBtn.textContent = '⏳ Resuming...';
      addDivider('Resuming Interrupted Team', 'round');
      setStatus('running', 'Resuming...');
      document.title = '⏳ Tiger Team - Resuming';
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('btn-send');
      input.disabled = true;
      sendBtn.disabled = true;

      try {
        const resp = await fetch('/api/tiger-team/resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: tigerTeamId, ...(note ? { message: note } : {}) }),
        });
        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          addSystemMsg('Resume failed: ' + (errData.error || `HTTP ${resp.status}`));
          setStatus('error', 'Resume Failed');
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          continuationInFlight = false;
          setInputMode('ended'); input.value = note; if (typeof growInput === 'function') growInput();   // the note is kept for another try
          return;
        }

        // The hub accepted the resume (and queued the note): only now is the note sent, drawn and cleared.
        if (note) { drawNoteCard(note); input.value = ''; clearUnsentNote(); }
        isRunning = true;
        resumeBtn.style.display = 'none';
        document.getElementById('btn-stop').disabled = false;

        // Raw EOF with no tt_complete/tt_error means the connection dropped mid-stream - that is not a successful
        // completion: afterStreamEnd follows the team again, or reports the interruption on an old hub.
        try { await readSSE(resp); await afterStreamEnd('Stream ended without completion'); }
        catch (e) { await afterStreamEnd(e.message); }
      } catch (e) {
        handleEvent({ gateway: { type: 'tt_interrupted', reason: e.message } });
      } finally {
        continuationInFlight = false;
      }
    }

    async function deleteSaved(id, element) {
      if (!confirm('Delete this saved session?')) return;
      try {
        await fetch(`/api/tiger-team/saved/${id}`, { method: 'DELETE' });
        if (element) element.remove();
      } catch (e) { alert('Delete failed: ' + e.message); }
    }

    // Store objective text for save
    let objectiveText = objective;

    // ── Auto-save system ──
    async function autoSave(force) {
      if (!saveKey && !sessionId && !tigerTeamId) return;
      const now = Date.now();
      if (force !== true && now - lastAutoSave < 10000) return; // Debounce: no more than every 10s (the final save is forced)
      lastAutoSave = now;
      const timeline = document.getElementById('timeline');
      const transcript = timeline ? timeline.innerHTML : '';
      try {
        await fetch('/api/tiger-team/autosave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: saveKey || sessionId || tigerTeamId,
            objective: objectiveText,
            coordinator,
            participants,
            transcript,
            mode,
            status: isRunning ? 'in_progress' : (document.getElementById('status-badge').classList.contains('complete') ? 'complete' : 'interrupted'),
          })
        });
      } catch (e) { /* silent - auto-save is best-effort */ }
    }

    function startAutoSave() {
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      autoSaveInterval = setInterval(autoSave, 30000); // Every 30s
    }

    function stopAutoSave() {
      if (autoSaveInterval) { clearInterval(autoSaveInterval); autoSaveInterval = null; }
      autoSave(true); // Final save on stop: forced, so the last events are never lost to the 10 s debounce
    }

    // Save on page unload (navigation away, close tab)
    window.addEventListener('beforeunload', () => {
      if (saveKey || sessionId || tigerTeamId) {
        const timeline = document.getElementById('timeline');
        const transcript = timeline ? timeline.innerHTML : '';
        // Use sendBeacon with Blob for reliable save on unload
        const blob = new Blob([JSON.stringify({
          session_id: saveKey || sessionId || tigerTeamId,
          objective: objectiveText,
          coordinator,
          participants,
          transcript,
          mode,
          status: isRunning ? 'in_progress' : (document.getElementById('status-badge').classList.contains('complete') ? 'complete' : 'interrupted'),
        })], { type: 'application/json' });
        navigator.sendBeacon('/api/tiger-team/autosave', blob);
      }
    });

    syncInputPad();
    init();
  </script>
</body>
