<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Tiger Team // War Room</title>
  <script src="/ui-looks.js"></script>
  <style>
    :root {
      --bg-dark: #090B0F;
      --bg-card: #14171F;
      --bg-input: #040507;
      --accent: #3D7BFF;
      --accent-hover: #5A93FF;
      --text: #F3F4F6;
      --text-dim: #9CA3AF;
      --text-tertiary: #6B7280;
      --success: #00D395;
      --warning: #F5A623;
      --error: #FF4C4C;
      --border: #222632;
      --border-strong: #333846;
      --radius: 6px;
      --tiger: #f97316;
    }
    /* page colours: today's exact values (Engineering) */
    :root {
      --tt-ac0: #f97316;
      --tt-ac0-bg: rgba(249,115,22,0.08);
      --tt-ac0-bd: rgba(249,115,22,0.25);
      --tt-ac1: #3b82f6;
      --tt-ac1-bg: rgba(59,130,246,0.08);
      --tt-ac1-bd: rgba(59,130,246,0.25);
      --tt-ac2: #a855f7;
      --tt-ac2-bg: rgba(168,85,247,0.08);
      --tt-ac2-bd: rgba(168,85,247,0.25);
      --tt-ac3: #14b8a6;
      --tt-ac3-bg: rgba(20,184,166,0.08);
      --tt-ac3-bd: rgba(20,184,166,0.25);
      --tt-ac4: #ec4899;
      --tt-ac4-bg: rgba(236,72,153,0.08);
      --tt-ac4-bd: rgba(236,72,153,0.25);
      --tt-ac5: #eab308;
      --tt-ac5-bg: rgba(234,179,8,0.08);
      --tt-ac5-bd: rgba(234,179,8,0.25);
      --tt-ac6: #06b6d4;
      --tt-ac6-bg: rgba(6,182,212,0.08);
      --tt-ac6-bd: rgba(6,182,212,0.25);
      --tt-ac7: #84cc16;
      --tt-ac7-bg: rgba(132,204,22,0.08);
      --tt-ac7-bd: rgba(132,204,22,0.25);
      --tt-ac8: #f43f5e;
      --tt-ac8-bg: rgba(244,63,94,0.08);
      --tt-ac8-bd: rgba(244,63,94,0.25);
      --tt-ac9: #8b5cf6;
      --tt-ac9-bg: rgba(139,92,246,0.08);
      --tt-ac9-bd: rgba(139,92,246,0.25);
      --tt-head-top: #111318;
      --tt-head-bot: #090B0F;
      --tt-tiger-glow: rgba(249,115,22,0.6);
      --tt-err-40: rgba(255,76,76,0.4);
      --tt-err-10: rgba(255,76,76,0.1);
      --tt-ok-40: rgba(76,175,80,0.4);
      --tt-ok: #4caf50;
      --tt-ok-10: rgba(76,175,80,0.1);
      --tt-info-40: rgba(100,181,246,0.4);
      --tt-info: #64b5f6;
      --tt-info-10: rgba(100,181,246,0.1);
      --tt-tiger-20: rgba(249,115,22,0.2);
      --tt-tiger-30: rgba(249,115,22,0.3);
      --tt-ok-20: rgba(0,211,149,0.2);
      --tt-ok-30: rgba(0,211,149,0.3);
      --tt-err-20: rgba(255,76,76,0.2);
      --tt-err-30: rgba(255,76,76,0.3);
      --tt-side-top: #0d1117;
      --tt-side-bot: #14171F;
      --tt-wash-03: rgba(255,255,255,0.03);
      --tt-wash-06: rgba(255,255,255,0.06);
      --tt-tiger-15: rgba(249,115,22,0.15);
      --tt-wash-05: rgba(255,255,255,0.05);
      --tt-red: #ef4444;
      --tt-tiger-05: rgba(249,115,22,0.05);
      --tt-red-50: rgba(239,68,68,0.5);
      --tt-amber: #f59e0b;
      --tt-on-ok: #090B0F;
      --tt-on-fill: #fff;
      --tt-user-inj: #e2e8f0;
      --tt-user-inj-bg: rgba(226,232,240,0.05);
      --tt-user-inj-bd: rgba(226,232,240,0.2);
      --tt-grey-15: rgba(100,100,120,0.15);
      --tt-grey-25: rgba(100,100,120,0.25);
      --tt-tool-ok: #4ade80;
      --tt-tool-err: #f87171;
      --tt-grey-08: rgba(100,100,120,0.08);
      --tt-grey-20: rgba(100,100,120,0.2);
      --tt-code-bg: rgba(0,0,0,0.3);
      --tt-wash-04: rgba(255,255,255,0.04);
      --tt-amber-50: rgba(245,158,11,0.5);
      --tt-err-12: rgba(255,76,76,0.12);
      --tt-amber-12: rgba(245,158,11,0.12);
      --tt-amber-40: rgba(245,158,11,0.4);
      --tt-wash-15: rgba(255,255,255,0.15);
      --tt-overlay: rgba(0,0,0,0.8);
      --tt-crash: #e94560;
      --tt-amber-05: rgba(245,158,11,0.05);
      --tt-green: #22c55e;
      --tt-model: #8ab4f8;
      --tt-amber2: #ffb74d;
      --tt-amber2-20: rgba(255,152,0,0.2);
      --tt-ok2-20: rgba(76,175,80,0.2);
      --tt-ok2: #81c784;
    }
    /* Broadsheet House and Quiet Page: the same names, mapped to the style roles */
    html[data-look]:not([data-look="engineering"]) {
      --tt-ac0: color-mix(in srgb, #f97316 45%, var(--text));
      --tt-ac0-bg: color-mix(in srgb, var(--tt-ac0) 9%, transparent);
      --tt-ac0-bd: color-mix(in srgb, var(--tt-ac0) 35%, transparent);
      --tt-ac1: color-mix(in srgb, #3b82f6 45%, var(--text));
      --tt-ac1-bg: color-mix(in srgb, var(--tt-ac1) 9%, transparent);
      --tt-ac1-bd: color-mix(in srgb, var(--tt-ac1) 35%, transparent);
      --tt-ac2: color-mix(in srgb, #a855f7 45%, var(--text));
      --tt-ac2-bg: color-mix(in srgb, var(--tt-ac2) 9%, transparent);
      --tt-ac2-bd: color-mix(in srgb, var(--tt-ac2) 35%, transparent);
      --tt-ac3: color-mix(in srgb, #14b8a6 45%, var(--text));
      --tt-ac3-bg: color-mix(in srgb, var(--tt-ac3) 9%, transparent);
      --tt-ac3-bd: color-mix(in srgb, var(--tt-ac3) 35%, transparent);
      --tt-ac4: color-mix(in srgb, #ec4899 45%, var(--text));
      --tt-ac4-bg: color-mix(in srgb, var(--tt-ac4) 9%, transparent);
      --tt-ac4-bd: color-mix(in srgb, var(--tt-ac4) 35%, transparent);
      --tt-ac5: color-mix(in srgb, #eab308 45%, var(--text));
      --tt-ac5-bg: color-mix(in srgb, var(--tt-ac5) 9%, transparent);
      --tt-ac5-bd: color-mix(in srgb, var(--tt-ac5) 35%, transparent);
      --tt-ac6: color-mix(in srgb, #06b6d4 45%, var(--text));
      --tt-ac6-bg: color-mix(in srgb, var(--tt-ac6) 9%, transparent);
      --tt-ac6-bd: color-mix(in srgb, var(--tt-ac6) 35%, transparent);
      --tt-ac7: color-mix(in srgb, #84cc16 45%, var(--text));
      --tt-ac7-bg: color-mix(in srgb, var(--tt-ac7) 9%, transparent);
      --tt-ac7-bd: color-mix(in srgb, var(--tt-ac7) 35%, transparent);
      --tt-ac8: color-mix(in srgb, #f43f5e 45%, var(--text));
      --tt-ac8-bg: color-mix(in srgb, var(--tt-ac8) 9%, transparent);
      --tt-ac8-bd: color-mix(in srgb, var(--tt-ac8) 35%, transparent);
      --tt-ac9: color-mix(in srgb, #8b5cf6 45%, var(--text));
      --tt-ac9-bg: color-mix(in srgb, var(--tt-ac9) 9%, transparent);
      --tt-ac9-bd: color-mix(in srgb, var(--tt-ac9) 35%, transparent);
      --tt-head-top: var(--bg-card);
      --tt-head-bot: var(--bg-dark);
      --tt-tiger-glow: color-mix(in srgb, var(--tiger) 40%, transparent);
      --tt-err-40: color-mix(in srgb, var(--error) 45%, transparent);
      --tt-err-10: color-mix(in srgb, var(--error) 10%, transparent);
      --tt-ok-40: color-mix(in srgb, var(--success) 45%, transparent);
      --tt-ok: var(--success);
      --tt-ok-10: color-mix(in srgb, var(--success) 10%, transparent);
      --tt-info-40: color-mix(in srgb, var(--accent) 45%, transparent);
      --tt-info: var(--accent);
      --tt-info-10: color-mix(in srgb, var(--accent) 10%, transparent);
      --tt-tiger-20: color-mix(in srgb, var(--tiger) 12%, transparent);
      --tt-tiger-30: color-mix(in srgb, var(--tiger) 40%, transparent);
      --tt-ok-20: color-mix(in srgb, var(--success) 12%, transparent);
      --tt-ok-30: color-mix(in srgb, var(--success) 40%, transparent);
      --tt-err-20: color-mix(in srgb, var(--error) 12%, transparent);
      --tt-err-30: color-mix(in srgb, var(--error) 40%, transparent);
      --tt-side-top: var(--bg-dark);
      --tt-side-bot: var(--bg-card);
      --tt-wash-03: color-mix(in srgb, var(--text) 4%, transparent);
      --tt-wash-06: color-mix(in srgb, var(--text) 7%, transparent);
      --tt-tiger-15: color-mix(in srgb, var(--tiger) 14%, transparent);
      --tt-wash-05: color-mix(in srgb, var(--text) 5%, transparent);
      --tt-red: var(--error);
      --tt-tiger-05: color-mix(in srgb, var(--tiger) 6%, transparent);
      --tt-red-50: color-mix(in srgb, var(--error) 50%, transparent);
      --tt-amber: var(--warning);
      --tt-on-ok: var(--on-color-text);
      --tt-on-fill: var(--on-color-text);
      --tt-user-inj: var(--text);
      --tt-user-inj-bg: color-mix(in srgb, var(--text) 5%, transparent);
      --tt-user-inj-bd: color-mix(in srgb, var(--text) 25%, transparent);
      --tt-grey-15: color-mix(in srgb, var(--text) 16%, transparent);
      --tt-grey-25: color-mix(in srgb, var(--text) 28%, transparent);
      --tt-tool-ok: var(--success);
      --tt-tool-err: var(--error);
      --tt-grey-08: color-mix(in srgb, var(--text) 6%, transparent);
      --tt-grey-20: color-mix(in srgb, var(--text) 22%, transparent);
      --tt-code-bg: color-mix(in srgb, var(--text) 7%, transparent);
      --tt-wash-04: color-mix(in srgb, var(--text) 5%, transparent);
      --tt-amber-50: color-mix(in srgb, var(--warning) 50%, transparent);
      --tt-err-12: color-mix(in srgb, var(--error) 10%, transparent);
      --tt-amber-12: color-mix(in srgb, var(--warning) 12%, transparent);
      --tt-amber-40: color-mix(in srgb, var(--warning) 45%, transparent);
      --tt-wash-15: var(--border-strong);
      --tt-overlay: color-mix(in srgb, var(--bg-dark) 94%, transparent);
      --tt-crash: var(--error);
      --tt-amber-05: color-mix(in srgb, var(--warning) 7%, transparent);
      --tt-green: var(--success);
      --tt-model: var(--accent-hover);
      --tt-amber2: var(--warning);
      --tt-amber2-20: color-mix(in srgb, var(--warning) 14%, transparent);
      --tt-ok2-20: color-mix(in srgb, var(--success) 14%, transparent);
      --tt-ok2: var(--success);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Agent Color Palette (10 distinct colors) ── */
    .agent-color-0  { --agent-color: var(--tt-ac0); --agent-bg: var(--tt-ac0-bg); --agent-border: var(--tt-ac0-bd); }
    .agent-color-1  { --agent-color: var(--tt-ac1); --agent-bg: var(--tt-ac1-bg); --agent-border: var(--tt-ac1-bd); }
    .agent-color-2  { --agent-color: var(--tt-ac2); --agent-bg: var(--tt-ac2-bg); --agent-border: var(--tt-ac2-bd); }
    .agent-color-3  { --agent-color: var(--tt-ac3); --agent-bg: var(--tt-ac3-bg); --agent-border: var(--tt-ac3-bd); }
    .agent-color-4  { --agent-color: var(--tt-ac4); --agent-bg: var(--tt-ac4-bg); --agent-border: var(--tt-ac4-bd); }
    .agent-color-5  { --agent-color: var(--tt-ac5); --agent-bg: var(--tt-ac5-bg); --agent-border: var(--tt-ac5-bd); }
    .agent-color-6  { --agent-color: var(--tt-ac6); --agent-bg: var(--tt-ac6-bg); --agent-border: var(--tt-ac6-bd); }
    .agent-color-7  { --agent-color: var(--tt-ac7); --agent-bg: var(--tt-ac7-bg); --agent-border: var(--tt-ac7-bd); }
    .agent-color-8  { --agent-color: var(--tt-ac8); --agent-bg: var(--tt-ac8-bg); --agent-border: var(--tt-ac8-bd); }
    .agent-color-9  { --agent-color: var(--tt-ac9); --agent-bg: var(--tt-ac9-bg); --agent-border: var(--tt-ac9-bd); }

    /* ── Header ── */
    .tt-header {
      background: linear-gradient(180deg, var(--tt-head-top) 0%, var(--tt-head-bot) 100%);
      border-bottom: 1px solid var(--tiger);
      box-shadow: 0 1px 0 var(--tt-ac0-bd), 0 4px 12px rgba(0,0,0,0.4);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .tt-header .tiger-icon { display: flex; align-items: center; filter: drop-shadow(0 0 5px var(--tt-tiger-glow)); }
    .tt-header .objective {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tt-header .objective.expanded {
      white-space: pre-wrap;
      overflow: visible;
      text-overflow: unset;
      max-height: 400px;
      overflow-y: auto;
    }
    .tt-header .objective .obj-label {
      color: var(--tiger);
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-right: 8px;
      font-family: 'Geist Mono', monospace;
    }
    .tt-controls { display: flex; align-items: center; gap: 8px; }
    .tt-btn {
      padding: 5px 14px;
      border-radius: 2px;
      border: 1px solid var(--border-strong);
      background: var(--bg-dark);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Geist Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tt-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .tt-btn.stop { border-color: var(--tt-err-40); color: var(--error); }
    .tt-btn.stop:hover { background: var(--tt-err-10); border-color: var(--error); }
    .tt-btn.save { border-color: var(--tt-ok-40); color: var(--tt-ok); }
    .tt-btn.save:hover { background: var(--tt-ok-10); border-color: var(--tt-ok); }
    .tt-btn.load { border-color: var(--tt-info-40); color: var(--tt-info); }
    .tt-btn.load:hover { background: var(--tt-info-10); border-color: var(--tt-info); }
    .tt-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .status-badge {
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-family: 'Geist Mono', monospace;
    }
    .status-badge.running { background: var(--tt-tiger-20); color: var(--tiger); border: 1px solid var(--tt-tiger-30); }
    .status-badge.running::before { content: '● '; font-size: 10px; color: var(--tiger); animation: blink 1s step-end infinite; }
    .status-badge.complete { background: var(--tt-ok-20); color: var(--success); border: 1px solid var(--tt-ok-30); }
    .status-badge.error { background: var(--tt-err-20); color: var(--error); border: 1px solid var(--tt-err-30); }
    .round-counter { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--tiger); background: var(--tt-ac0-bg); padding: 4px 10px; border-radius: 2px; border: 1px solid var(--tt-tiger-30); letter-spacing: 0.12em; text-transform: uppercase; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Layout ── */
    .tt-body { flex: 1; display: flex; overflow: hidden; }

    /* ── Roster Panel ── */
    .roster-panel {
      width: 200px;
      min-width: 160px;
      background: linear-gradient(180deg, var(--tt-side-top) 0%, var(--tt-side-bot) 100%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .roster-section { padding: 12px; }
    .roster-section h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--tiger); margin-bottom: 12px; font-family: 'Geist Mono', monospace; font-weight: 700; }
    .roster-agent {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: var(--tt-wash-03);
      position: relative;
    }
    .roster-agent:hover { background: var(--tt-wash-06); border-color: var(--border-strong); }
    .roster-agent.active { border-color: var(--agent-color, var(--tiger)); background: var(--agent-bg, var(--tt-ac0-bg)); box-shadow: 0 0 12px var(--tt-tiger-15); }
    .roster-agent .agent-icon { font-size: 22px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--tt-wash-05); border-radius: 6px; flex-shrink: 0; }
    .roster-agent .agent-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .roster-agent .agent-role { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .roster-agent .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .roster-agent .activity-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .roster-agent .activity-dot.working { background: var(--tiger); animation: pulse 1s infinite; }
    .roster-agent .remove-btn { display: none; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 2px 6px; line-height: 1; opacity: 0.6; position: absolute; top: 6px; right: 6px; }
    .roster-agent .remove-btn:hover { color: var(--tt-red); opacity: 1; }
    .roster-agent:hover .remove-btn { display: inline; }
    .add-participant-btn { display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin-top: 10px; background: none; border: 1px dashed var(--border); border-radius: 6px; color: var(--text-dim); font-size: 13px; cursor: pointer; width: 100%; font-weight: 500; }
    .add-participant-btn:hover { border-color: var(--tiger); color: var(--tiger); background: var(--tt-tiger-05); }
    .add-dropdown { position: absolute; left: 10px; right: 10px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; max-height: 240px; overflow-y: auto; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
    .add-dropdown-item { padding: 10px 14px; font-size: 14px; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .add-dropdown-item:hover { background: var(--tt-tiger-15); }
    .roster-agent .activity-dot.done { background: var(--success); }
    .roster-agent .activity-dot.failed { background: var(--tt-red); }

    /* ── Timeline ── */
    .timeline-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .timeline-panel::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.015) 3px, rgba(0,0,0,0.015) 6px);
    }
    .timeline-scroll { flex: 1; overflow-y: auto; padding: 14px 20px; }
    .timeline-scroll::-webkit-scrollbar { width: 6px; }
    .timeline-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ── Agent Response Blocks ── */
    .agent-block {
      margin-bottom: 16px;
      border-radius: 2px;
      overflow: hidden;
      background: var(--agent-bg);
      border: 1px solid var(--agent-border);
      border-left: 3px solid var(--agent-color, var(--tiger));
    }
    .agent-block.failed { border-color: var(--tt-red-50); }
    /* A short line inside a card: the task a member was given, a member waiting its turn, why it failed. */
    .block-note { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }
    .block-note.task { margin-top: 0; margin-bottom: 6px; font-style: italic; }
    .block-note.waiting { color: var(--tt-amber); }
    .block-note.failed { color: var(--tt-red); font-weight: 600; }
    .approval-card { border: 1px solid var(--warning); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg-input); }
    .approval-card.answered { opacity: 0.65; border-color: var(--border-strong); }
    .approval-title { font-weight: 600; font-size: 14px; }
    .approval-summary { font-size: 13px; color: var(--text-dim); margin-top: 4px; word-break: break-word; }
    .approval-detail { font-size: 12px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; margin-top: 4px; }
    .approval-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--text-tertiary); }
    .approval-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .approval-actions button { border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 14px; background: transparent; color: var(--text); cursor: pointer; font-size: 13px; }
    .approval-actions .allow { background: var(--success); color: var(--tt-on-ok); border-color: var(--success); }
    .approval-actions .deny { background: var(--error); color: var(--tt-on-fill); border-color: var(--error); }
    .approval-actions button:disabled { opacity: 0.5; cursor: default; }
    .file-cards { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 4px; }
    .file-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; max-width: 420px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-input); }
    .file-card .fc-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .file-card .fc-icon { font-size: 24px; line-height: 1; flex: 0 0 auto; }
    .file-card .fc-meta { min-width: 0; flex: 1 1 auto; }
    .file-card .fc-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-card .fc-sub { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-card .fc-preview { max-width: 100%; max-height: 160px; object-fit: contain; border-radius: 6px; align-self: flex-start; }
    .file-card .fc-preview-link { color: var(--accent); font-size: 13px; text-decoration: none; align-self: flex-start; }
    .file-card .fc-download { display: block; text-align: center; background: var(--accent); border-radius: 6px; padding: 8px 14px; color: var(--tt-on-fill); font-size: 13px; font-weight: 600; text-decoration: none; }
    .file-card .fc-download:hover { background: var(--accent-hover); }
    .agent-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--agent-color);
      background: var(--agent-bg);
      border-bottom: 1px solid var(--agent-border);
    }
    .agent-block-header .block-icon { font-size: 16px; }
    .agent-block-header .block-agent { font-size: 13px; font-weight: 700; }
    .agent-block-header .block-role {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--tt-wash-05);
    }
    .agent-block-header .block-time { margin-left: auto; font-size: 10px; color: var(--text-tertiary); font-family: 'Geist Mono', monospace; }

    .agent-block-body { padding: 12px 16px; font-size: 13px; line-height: 1.7; color: var(--text-dim); }
    .agent-block.user-inject { --agent-color: var(--tt-user-inj); --agent-bg: var(--tt-user-inj-bg); --agent-border: var(--tt-user-inj-bd); }

    /* ── Tool Calls (matching main UI style) ── */
    .tool-calls-container {
      margin: 8px 0 12px 0;
      padding: 8px 0;
      border-top: 1px solid var(--tt-grey-15);
      border-bottom: 1px solid var(--tt-grey-15);
    }
    .tool-call-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-family: 'Geist Mono', monospace;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .tool-call-line + .tool-call-line { margin-top: 2px; }
    .tool-call-line.running { color: var(--text-dim); }
    .tool-call-line.done { opacity: 0.7; }
    .tool-call-line.error { opacity: 0.9; }
    .tool-call-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--tt-grey-25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: tool-spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes tool-spin { to { transform: rotate(360deg); } }
    .tool-call-icon { flex-shrink: 0; font-size: 0.75rem; width: 12px; text-align: center; }
    .tool-call-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tool-call-name { font-weight: 600; color: var(--accent); white-space: nowrap; }
    .tool-call-input { color: var(--text-dim); opacity: 0.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 500px; }
    .tool-call-status { font-size: 0.65rem; font-weight: 500; white-space: nowrap; }
    .tool-call-status.done { color: var(--tt-tool-ok); }
    .tool-call-status.error { color: var(--tt-tool-err); }
    .tool-call-result {
      margin-top: 4px;
      margin-left: 20px;
      padding: 6px 10px;
      background: var(--tt-grey-08);
      border-radius: 4px;
      border-left: 2px solid var(--tt-grey-20);
      font-size: 0.68rem;
      font-family: 'Geist Mono', monospace;
      color: var(--text-dim);
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .tool-call-result.visible { display: block; }
    .tool-call-toggle { font-size: 0.63rem; color: var(--accent); cursor: pointer; opacity: 0.6; white-space: nowrap; }
    .tool-call-toggle:hover { opacity: 1; }

    /* ── Dividers ── */
    .tl-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tl-divider::before, .tl-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .tl-divider.round { color: var(--tiger); }
    .tl-divider.round::before, .tl-divider.round::after { background: var(--tt-tiger-30); }
    .tl-divider.complete { color: var(--success); }
    .tl-divider.complete::before, .tl-divider.complete::after { background: var(--tt-ok-30); }

    .system-msg {
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .system-msg .sys-time { font-family: 'Geist Mono', monospace; font-size: 10px; margin-left: auto; }

    /* ── Markdown ── */
    .agent-block-body h1, .agent-block-body h2, .agent-block-body h3, .agent-block-body h4 { margin: 10px 0 4px; font-weight: 700; color: var(--text); }
    .agent-block-body h1 { font-size: 16px; }
    .agent-block-body h2 { font-size: 15px; }
    .agent-block-body h3 { font-size: 14px; }
    .agent-block-body h4 { font-size: 13px; }
    .agent-block-body p { margin: 3px 0; }
    .agent-block-body ul, .agent-block-body ol { margin: 3px 0; padding-left: 18px; }
    .agent-block-body li { margin: 2px 0; }
    .agent-block-body code { font-family: 'Geist Mono', monospace; background: var(--tt-code-bg); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    .agent-block-body pre { background: var(--tt-code-bg); padding: 8px 12px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
    .agent-block-body pre code { background: transparent; padding: 0; }
    .agent-block-body table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 12px; }
    .agent-block-body th, .agent-block-body td { padding: 4px 8px; border: 1px solid var(--border); text-align: left; }
    .agent-block-body th { background: var(--tt-wash-05); font-weight: 600; }
    .agent-block-body a { color: var(--accent); text-decoration: none; }
    .agent-block-body a:hover { text-decoration: underline; }
    .agent-block-body strong { font-weight: 600; color: var(--text); }
    .agent-block-body em { font-style: italic; }
    .agent-block-body blockquote { border-left: 3px solid var(--border-strong); padding-left: 10px; margin: 4px 0; color: var(--text-dim); }

    /* ── Input Bar ── */
    .input-bar {
      flex-shrink: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-bar .input-label { font-size: 11px; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
    .input-bar input, .input-bar textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      line-height: 1.4;
      max-height: calc(1.4em * 3 + 18px);   /* grows to 3 lines, then scrolls */
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-bar input:focus, .input-bar textarea:focus { border-color: var(--accent); }
    .input-bar input::placeholder, .input-bar textarea::placeholder { color: var(--text-tertiary); }
    .input-bar input:disabled, .input-bar textarea:disabled { opacity: 0.4; }
    .input-bar .send-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: var(--tt-on-fill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .input-bar .send-btn:hover { background: var(--accent-hover); }
    .input-bar .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Member state: the current step in the side roster; the chip strip is phone-only ── */
    .roster-agent .agent-step { font-size: 11px; color: var(--text-dim); margin-top: 3px; overflow-wrap: anywhere; line-height: 1.3; }
    .roster-agent .agent-step:empty { display: none; }
    .roster-agent .activity-dot.waiting { background: var(--warning); animation: pulse 1.6s infinite; }
    .member-strip { display: none; }
    .chip-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
    .chip-dot.working { background: var(--tiger); animation: pulse 1s infinite; }
    .chip-dot.done { background: var(--success); }
    .chip-dot.failed { background: var(--tt-red); }
    .chip-dot.waiting { background: var(--warning); animation: pulse 1.6s infinite; }

    /* ── Header: the More menu and the Back link exist for the phone only ── */
    .tt-more { display: contents; }
    .tt-more-btn, .tt-back { display: none; }
    .tt-back { text-decoration: none; }
    .from-mobile .tt-back { display: flex; align-items: center; min-height: 40px; }   /* opened from the phone app: a way back */

    /* ── Teams list (the phone's way in: /tiger-team?from=mobile with no team to load) ── */
    .teams-home { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .teams-home h2 { font-size: 16px; color: var(--text); }
    .teams-home .teams-empty { color: var(--text-dim); font-size: 14px; }
    .team-row { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--bg-card); min-height: 44px; }
    .team-row:active { border-color: var(--accent); }
    .team-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .team-chip { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 2px; background: var(--tt-wash-06); color: var(--text-dim); }
    .team-chip.running { background: var(--tt-tiger-20); color: var(--tiger); }
    .team-chip.completed { background: var(--tt-ok-20); color: var(--success); }
    .team-chip.problem { background: var(--tt-err-20); color: var(--error); }
    .team-time { font-size: 11px; color: var(--text-tertiary); font-family: 'Geist Mono', monospace; }
    /* The list alone: no input bar, no roster, no controls, only the status badge. */
    .teams-view .input-bar, .teams-view .roster-panel, .teams-view .member-strip { display: none !important; }
    .teams-view .tt-controls > :not(.status-badge) { display: none !important; }
    .teams-view .timeline-scroll { padding-bottom: 16px; }
    .team-obj { margin-top: 6px; font-size: 14px; line-height: 1.4; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

    /* ── Phone: a usable view of a running team (390 px wide and up) ── */
    @media (max-width: 700px) {
      html, body { max-width: 100vw; overflow-x: hidden; }
      body { height: 100vh; height: 100dvh; font-size: 14px; }

      /* Header: the mission on one line, round + status + Stop visible, everything else in More. */
      .tt-header { flex-wrap: wrap; padding: 8px 10px; gap: 8px; position: relative; }
      .tt-header .tiger-icon img { width: 24px; height: 24px; }
      .tt-header .objective { flex: 1 1 0; min-width: 0; }
      .tt-header .objective .obj-label { display: none; }
      .tt-controls { order: 3; flex: 1 0 100%; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
      .tt-controls .tt-btn { min-height: 40px; padding: 6px 12px; }
      .tt-more-btn { display: flex; }
      .tt-more { display: none; position: absolute; right: 10px; top: 100%; z-index: 200; flex-direction: column; gap: 6px; min-width: 12rem; max-width: calc(100vw - 20px); padding: 8px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
      .tt-more.open { display: flex; }
      .tt-more .tt-btn { width: 100%; justify-content: flex-start; }
      #tt-error-banner, #tt-retry-banner { padding: 6px 10px !important; overflow-wrap: anywhere; }

      /* Roster: the side column becomes a strip of chips under the header. */
      .roster-panel { display: none; }
      .member-strip { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--tt-side-top); -webkit-overflow-scrolling: touch; }
      .member-strip:empty { display: none; }
      .member-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 44px; max-width: 220px; padding: 6px 12px; border-radius: 22px; border: 1px solid var(--agent-border, var(--border-strong)); background: var(--agent-bg, var(--tt-wash-04)); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
      .chip-icon { font-size: 18px; flex-shrink: 0; }
      .chip-main { display: flex; flex-direction: column; min-width: 0; }
      .chip-name { font-size: 13px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip-step { font-size: 11px; line-height: 1.2; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip-step:empty { display: none; }

      /* Timeline: full width, small padding, nothing wider than the screen; room at the bottom for the fixed input bar. */
      .tt-body { flex-direction: column; min-height: 0; }
      .timeline-panel { width: 100%; min-width: 0; }
      .timeline-scroll { padding: 10px 10px calc(var(--input-h, 130px) + 16px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
      .agent-block { overflow: visible; margin-bottom: 12px; max-width: 100%; }
      .agent-block-header { padding: 8px 10px; flex-wrap: wrap; }
      /* The reply (the coordinator's final report included) reads at 15 px and wraps instead of clipping. */
      .agent-block-body { padding: 10px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; word-break: break-word; }
      .agent-block-body pre { white-space: pre-wrap; overflow-x: auto; max-width: 100%; }
      .agent-block-body code { font-size: 13px; overflow-wrap: anywhere; }
      .agent-block-body table { display: block; overflow-x: auto; max-width: 100%; }
      .agent-block-body img { max-width: 100%; height: auto; }
      .agent-block-body button { min-height: 40px; }
      .block-note, .system-msg { overflow-wrap: anywhere; }
      .tool-call-line { padding: 4px 6px; }
      .tool-call-info { flex-wrap: nowrap; overflow: hidden; }
      .tool-call-input { flex: 1 1 0; min-width: 0; max-width: none; }
      .tool-call-result { margin-left: 8px; overflow-wrap: anywhere; }
      .approval-actions button { min-height: 40px; min-width: 88px; }
      .file-card { max-width: 100%; }
      #saved-panel { padding: 12px !important; }

      /* Input bar: fixed at the bottom, the label above the box, the box grows to 3 lines, the button stays in view. */
      .input-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; flex-wrap: wrap; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); }
      .input-bar .input-label { flex: 0 0 100%; white-space: normal; }
      .input-bar #interject-target { flex: 0 0 100%; min-height: 40px; margin-right: 0 !important; }
      .input-bar textarea { flex: 1 1 0; min-height: 40px; font-size: 16px; }
      .input-bar .send-btn { flex: 0 0 auto; min-height: 40px; min-width: 84px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="tt-header">
    <a class="tt-btn tt-back" id="tt-back" href="/mobile" title="Back to the phone app">&lsaquo; Back</a>
    <span class="tiger-icon"><img src="/images/tiger-logo.svg" width="32" height="32" alt="Tiger Team"></span>
    <div class="objective" onclick="this.classList.toggle('expanded')" title="Click to expand/collapse">
      <span class="obj-label">Mission</span>
      <span id="objective-text">Loading...</span>
    </div>
    <div class="tt-controls">
      <span class="round-counter" id="round-counter">-</span>
      <button class="tt-btn" id="btn-resume" onclick="resumeInterruptedTeam()" style="display:none; border-color: var(--tt-amber-50); color: var(--tt-amber);" title="Resume this interrupted/stopped/blocked investigation">▶ Resume Interrupted</button>
      <button class="tt-btn stop" id="btn-stop" onclick="stopSession()" disabled>⏹ Stop</button>
      <button class="tt-btn tt-more-btn" id="btn-more" type="button" aria-haspopup="true" aria-expanded="false" onclick="toggleMoreMenu(event)">&#x22EF; More</button>
      <div class="tt-more" id="tt-more">
        <button class="tt-btn save" id="btn-save" onclick="saveSession()" disabled>💾 Save</button>
        <button class="tt-btn" onclick="reconcileUnknownOutcomes()" title="Record verified outcomes for uncertain operations">Resolve Unknowns</button>
        <button class="tt-btn" onclick="downloadFullRecord()" title="Download prompts, stream events, full tool results and raw artifacts">Full Record</button>
        <button class="tt-btn load" id="btn-load" onclick="toggleSavedPanel()">📂 Load</button>
      </div>
      <span class="status-badge running" id="status-badge">Starting</span>
    </div>
  </div>
  <div id="tt-error-banner" style="display:none; background: var(--tt-err-12); border-bottom: 1px solid var(--tt-err-40); color: var(--error); padding: 6px 20px; font-size: 12px; font-weight:600;"></div>
  <div id="tt-retry-banner" style="display:none; background: var(--tt-amber-12); border-bottom: 1px solid var(--tt-amber-40); color: var(--tt-amber); padding: 6px 20px; font-size: 12px; font-weight:600;"></div>

  <!-- Phone: the members as a strip of chips (state dot + current step); hidden on a wide screen, where the roster shows them -->
  <div class="member-strip" id="member-strip" role="list" aria-label="Team members"></div>

  <!-- Body -->
  <div class="tt-body">
    <div class="roster-panel" id="roster-panel">
      <div class="roster-section" id="coord-section">
        <h4>👑 Coordinator</h4>
        <div id="coordinator-roster"></div>
      </div>
      <div class="roster-section" id="part-section" style="position:relative;">
        <h4>👥 Participants</h4>
        <div id="participants-roster"></div>
        <button class="add-participant-btn" id="btn-add-participant" onclick="showAddDropdown()">+ Add Agent</button>
        <div class="add-dropdown" id="add-dropdown" style="display:none;"></div>
      </div>
      <div class="roster-section" id="challenger-section" style="display:none;">
        <h4>⚔️ Challenger</h4>
        <div id="challenger-roster"></div>
      </div>
    </div>
    <div class="timeline-panel">
      <div class="timeline-scroll" id="timeline"></div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar" id="input-bar">
    <span class="input-label">💬 Inject:</span>
    <select id="interject-target" title="Who receives it now" style="padding:6px;border-radius:6px;border:1px solid var(--tt-wash-15);background:transparent;color:inherit;font:inherit;margin-right:6px">
      <option value="team">Team: coordinator + everyone working now</option>
      <option value="coordinator">Coordinator only</option>
    </select>
    <textarea id="user-input" rows="1" placeholder="Tell the team something now…" disabled></textarea>
    <button class="send-btn" id="btn-send" onclick="injectMessage()" disabled>Interject</button>
  </div>

  <!-- Saved Sessions Panel (overlay) -->
  <div id="saved-panel" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--tt-overlay); z-index:9999; overflow-y:auto; padding:40px;">
    <div style="max-width:700px; margin:0 auto; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="margin:0; color:var(--text); font-size:18px;">📂 Saved Tiger Teams</h2>
        <button onclick="toggleSavedPanel()" style="background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <div id="saved-list" style="display:flex; flex-direction:column; gap:8px;">Loading...</div>
    </div>
  </div>

  <!-- Vendored, pinned (see NOTICE): marked 18.1.1 (MIT), DOMPurify 3.4.16 (Apache-2.0 / MPL-2.0). No CDN. -->
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/ui-dialog.js"></script>
  <script src="/ui-file-card.js"></script>
  <script>
    window.dialogGuard = typeof createDialogGuard === 'function' ? createDialogGuard({ trackSaves: false }) : null;
    // Every agent- or server-supplied string that goes into markup passes through this.
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    // ── Parse URL params ──
    const params = new URLSearchParams(window.location.search);
    // Opened from the phone app (its menu): a "‹ Back" link to /mobile, and the Teams list when there is no team to open.
    const fromMobile = params.get('from') === 'mobile';
    if (fromMobile) document.body.classList.add('from-mobile');
    const launchId = params.get('launch');
    let coordinator = params.get('coordinator');
    let participants = (params.get('participants') || '').split(',').filter(Boolean);
    let objective = params.get('objective') || 'No objective specified';
    let maxRounds = parseInt(params.get('maxRounds') || '5', 10);
    let context = params.get('context') || '';
    let mode = params.get('mode') || 'led';
    let challenger = params.get('challenger') || '';
    let challengerDirective = params.get('challengerDirective') || '';
    let directives = (() => { try { return JSON.parse(params.get('directives') || '{}'); } catch { return {}; } })();
    let alertId = params.get('alert_id') || '';
    let autoLaunched = params.get('autoLaunched') === '1';

    // If launched via staged params, fetch them from server
    let stagedReady = !launchId; // true if no staged fetch needed
    async function fetchStagedParams() {
      if (!launchId) return;
      try {
        const res = await fetch(`/api/tiger-team/staged/${launchId}`);
        if (!res.ok) throw new Error(`Staged params not found (${res.status})`);
        const data = await res.json();
        coordinator = data.coordinator || coordinator;
        participants = data.participants || participants;
        objective = data.objective || objective;
        maxRounds = data.max_rounds ?? maxRounds;
        context = data.context || context;
        mode = data.mode || mode;
        challenger = data.challenger || challenger;
        challengerDirective = data.challengerDirective || challengerDirective;
        directives = data.directives || directives;
        alertId = data.alert_id || alertId;
        autoLaunched = data.autoLaunched || autoLaunched;
        stagedReady = true;
      } catch (e) {
        document.body.innerHTML = `<div style="color: var(--tt-crash); padding: 40px; font-size: 16px;">Error loading Tiger Team: ${e.message}<br><br>The launch may have expired (5 min TTL). Try launching again.</div>`;
      }
    }

    // ── State ──
    let agents = {};
    let currentBlock = null;
    let currentAgent = null;
    const skipToolIds = new Set();
    let startTime = Date.now();
    let toolMap = new Map();   // tool key (dispatch + tool id) -> its row; two members may use the same tool id
    const toolIdPrefix = 't' + Math.random().toString(36).slice(2, 7) + '-';   // DOM ids unique per page, even next to a loaded transcript
    let toolSeq = 0;
    /** A tool's key: the dispatch it belongs to (tt_call) plus its id, so parallel members never share a row. */
    function toolKey(evt, gw) { return ((evt && evt.tt_call) || '') + '|' + (gw.tool_call_id || gw.tool); }
    let suppressToolNames = new Set(['consult_agent']);
    let sessionId = null;
    let tigerTeamId = null;
    let saveKey = null; // Stable key for auto-save - set ONCE, never changes across continuations
    let isRunning = false;
    let autoSaveInterval = null;
    let lastAutoSave = 0;
    let continuationInFlight = false; // Guards against double continue/resume/approve calls
    let backendRecoveryAvailable = true; // Flipped false if /status 404s in a way indicating old backend
    // Members work at the same time: each dispatch has its own card, found by the call key its events carry (tt_call).
    const callBlocks = new Map();
    let lastSeq = 0;              // the team's last event drawn here (tt_seq): a reconnect asks for what came after it
    let eventNow = null;          // the time of the event being drawn (tt_at), so a replay shows when things happened
    let clockSet = false;         // the timeline clock starts at the team's first event, not at page load
    let streamSupported = null;   // false on a hub without live replay: the old behaviour
    const sentInterjections = []; // interjections this page drew itself, so their echo is not drawn twice

    // ── Agent color assignment ──
    const agentColorMap = new Map();
    let colorIndex = 0;
    function getAgentColorClass(slug) {
      if (!agentColorMap.has(slug)) {
        agentColorMap.set(slug, colorIndex % 10);
        colorIndex++;
      }
      return 'agent-color-' + agentColorMap.get(slug);
    }

    // ── Marked config ──
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
    }

    const purifyReady = () => typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function';
    function md(text) {
      if (!text) return '';
      // Fail closed: without the sanitizer, agent output is shown as escaped text, never parsed as HTML.
      if (!purifyReady()) return esc(text).replace(/\n/g, '<br>');
      const html = typeof marked !== 'undefined' ? marked.parse(text) : esc(text).replace(/\n/g, '<br>');
      ensurePurifyHook();
      return DOMPurify.sanitize(html, {
        ALLOWED_TAGS: ['b','i','em','strong','code','pre','br','p','ul','ol','li','h1','h2','h3','h4','h5','h6','a','blockquote','hr','span','div','table','thead','tbody','tr','th','td','img','details','summary','del','s','sub','sup'],
        ALLOWED_ATTR: ['href','target','rel','src','alt','class'],
        ALLOW_DATA_ATTR: false,
        SANITIZE_DOM: true,
        FORBID_ATTR: ['onerror','onload','onclick','onmouseover','onfocus','onblur','style','id','name']
      });
    }
    // Member text must not load remote images (tracking) or carry page ids (DOM clobbering).
    let purifyHooked = false;
    /** Registers the node hook once; called before EVERY DOMPurify.sanitize (live text and saved transcripts alike). */
    function ensurePurifyHook() {
      if (purifyHooked || !purifyReady() || typeof DOMPurify.addHook !== 'function') return;
      purifyHooked = true;
      DOMPurify.addHook('afterSanitizeAttributes', purifyFixNode);
    }
    /** An img src survives only as a plain same-origin path: no whitespace or control characters anywhere (browsers
     *  strip a tab/newline/CR inside "/&#9;/evil.example" and load //evil.example), starts with "/" but not "//" or "/\". */
    function sameOriginImgSrc(src, origin) {
      if (typeof src !== 'string' || !src) return false;
      if (/[\s\x00-\x1f\x7f]/.test(src)) return false;
      if (!(src.charAt(0) === '/' && src.charAt(1) !== '/' && src.charAt(1) !== '\\')) return false;
      try { return new URL(src, origin).origin === origin; } catch { return false; }
    }
    function purifyFixNode(node) {
      if (!node || !node.tagName) return;
      const tag = node.tagName.toLowerCase();
      if (tag === 'img') {
        const src = node.getAttribute('src') || '';
        if (!sameOriginImgSrc(src, location.origin)) node.removeAttribute('src');
      } else if (tag === 'a') {
        const href = node.getAttribute('href') || '';
        node.setAttribute('rel', 'noopener noreferrer');
        if (/^[a-z][a-z0-9+.-]*:|^\/\//i.test(href)) node.setAttribute('target', '_blank');
        else node.removeAttribute('target');
      }
    }

    /** Seconds as the war room writes them: "42s", "3m 12s". */
    function fmtDuration(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      return s >= 60 ? `${Math.floor(s/60)}m ${s%60}s` : `${s}s`;
    }
    /** The local clock time of a moment, 24 hours: "22:14". */
    function clockTime(ms) {
      const d = new Date(ms);
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    /** The stamp on a card or note: the clock time it happened, "22:14" (a finished member card adds " · took 42s"). */
    function stampText(nowMs) {
      return clockTime(nowMs);
    }
    function elapsed() {
      return fmtDuration(((eventNow || Date.now()) - startTime) / 1000);
    }
    function stamp() {
      return stampText(eventNow || Date.now(), startTime);
    }

    let userScrolledUp = false;
    function scrollBottom() {
      if (userScrolledUp) return;
      const tl = document.getElementById('timeline');
      tl.scrollTop = tl.scrollHeight;
    }
    // Detect user scrolling up; re-enable auto-scroll when near bottom
    document.addEventListener('DOMContentLoaded', () => {
      const tl = document.getElementById('timeline');
      if (tl) {
        tl.addEventListener('scroll', () => {
          const atBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
          userScrolledUp = !atBottom;
        });
      }
    });

    // ── Initialize ──
    const loadParam = params.get('load');
    const loadOnly = loadParam === 'true';
    const loadSaveId = (loadParam && loadParam !== 'true') ? loadParam : null;

    // Probe the recovery backend once at load - if /status 404s (old server
    // that hasn't been restarted with this feature yet), disable all Resume
    // UI rather than offering a button that will always fail.
    async function checkBackendRecovery() {
      try {
        const resp = await fetch('/api/tiger-team/status?id=__probe__');
        // 404 for a real-but-missing id is expected and FINE (endpoint exists).
        // Only a routing-level 404 body without our error shape indicates the
        // endpoint itself doesn't exist yet - but since our own handler always
        // returns the same jsonResponse shape for "not found", any JSON 400/404
        // response here proves the route exists.  A non-JSON response or a
        // generic "Not found" (the server's catch-all 404) means it's missing.
        if (resp.status === 404) {
          const data = await resp.json().catch(() => null);
          if (!data || data.error === 'Not found') {
            backendRecoveryAvailable = false;
          }
        }
      } catch {
        backendRecoveryAvailable = false;
      }
      if (!backendRecoveryAvailable) {
        document.getElementById('btn-resume').style.display = 'none';
        console.warn('[tiger-team] Backend recovery endpoints unavailable - Resume disabled until server restart.');
      }
    }

    async function init() {
      // From the phone app with no team to open (no launch, no load, no parameters): the list of teams to choose from.
      if (fromMobile && !launchId && !loadParam && !coordinator) { await showTeamsHome(); return; }
      // Fetch staged params if launched via launchId
      if (launchId && !loadSaveId) await fetchStagedParams();
      if (!stagedReady && !loadSaveId) return;

      // Awaited (cheap single GET) so loadSaved()'s Resume-button visibility
      // check below sees the correct backendRecoveryAvailable value.
      await checkBackendRecovery();

      showObjective(loadOnly ? 'Select a saved session to load' : objective);
      try {
        const res = await fetch('/api/agents');
        const data = await res.json();
        const list = data.agents || data;
        for (const a of list) agents[a.name] = a;
      } catch (e) { console.error('Agent fetch failed:', e); }

      if (loadSaveId) {
        // Direct load of a specific save by ID: a team journaled since live replay is redrawn from its own events
        // (and followed while it still works); older saves show their saved transcript.
        if (await loadTeam(loadSaveId)) return;
        await loadSaved(loadSaveId);
        return;
      }
      if (loadOnly) {
        // Open saved panel immediately
        toggleSavedPanel();
        return;
      }

      // Pre-assign colors: coordinator first, then participants
      getAgentColorClass(coordinator);
      participants.forEach(p => getAgentColorClass(p));

      buildRoster();
      startTigerTeam();
    }

    function buildRoster() {
      const coordEl = document.getElementById('coordinator-roster');
      const partEl = document.getElementById('participants-roster');
      if (inputMode === 'running') buildTargetOptions();   // the member list changed: so does the target list
      const challEl = document.getElementById('challenger-roster');
      const challSection = document.getElementById('challenger-section');

      if (mode === 'roundtable') {
        document.getElementById('coord-section').style.display = 'none';
        document.querySelector('#part-section h4').textContent = '👥 Participants';
        const all = [coordinator, ...participants];
        partEl.innerHTML = all.map(slug => agentRosterHTML(slug, 'Participant')).join('');
        challSection.style.display = 'none';
      } else {
        coordEl.innerHTML = agentRosterHTML(coordinator, 'Coordinator', true);
        partEl.innerHTML = participants.map(slug => agentRosterHTML(slug, 'Participant')).join('');
        if (challenger && agents[challenger]) {
          challSection.style.display = 'block';
          challEl.innerHTML = agentRosterHTML(challenger, 'Challenger', true);
        } else {
          challSection.style.display = 'none';
        }
      }
      buildChips();   // the phone's strip of chips (and a rebuilt roster shows each member's state again)
      for (const slug of memberStates.keys()) renderMember(slug);
    }

    function agentRosterHTML(slug, role, isCoord = false) {
      const a = agents[slug] || { display: slug, icon: '🤖' };
      const colorClass = getAgentColorClass(slug);
      const removeBtn = isCoord ? '' : `<button class="remove-btn" onclick="removeParticipant('${esc(slug)}')" title="Remove">×</button>`;
      return `
        <div class="roster-agent ${colorClass}" id="roster-${esc(slug)}">
          <span class="agent-icon">${esc(a.icon || '🤖')}</span>
          <div style="flex:1">
            <div class="agent-name">${esc(a.display || slug)}</div>
            <div class="agent-role">${role}</div>
            <div class="agent-step" id="step-${esc(slug)}"></div>
          </div>
          ${removeBtn}
          <span class="activity-dot" id="dot-${slug}"></span>
        </div>`;
    }

    function setDot(slug, status) {
      const dot = document.getElementById('dot-' + slug);
      if (dot) dot.className = 'activity-dot ' + status;
      const row = document.getElementById('roster-' + slug);
      if (row) row.classList.toggle('active', status === 'working');
      noteDotChange(slug, status);   // the member's state (and its current step) follows the dot
    }

    // ── Member state: where each member stands right now ──
    // memberStates: slug -> { state: 'working' | 'done' | 'failed' | 'waiting', step: string, at: ms }.
    // The same events that draw the cards keep it current (dot changes, tool start/use/result, text, notices), so a
    // replay (loadTeam) rebuilds it too. It is drawn in the side roster (desktop) and in the chips (phone), as text only.
    const memberStates = new Map();
    /** A tool's input as one short readable piece: a path shows its file name, a command its first words. */
    function toolSummary(input) {
      if (input === null || input === undefined || input === '') return '';
      let v = input;
      if (typeof v === 'string') {
        const t = v.trim();
        if (t.charAt(0) === '{') { try { v = JSON.parse(t); } catch { v = t; } } else v = t;
      }
      if (v && typeof v === 'object') {
        const keys = ['file_path', 'path', 'file', 'filename', 'command', 'cmd', 'query', 'url', 'pattern', 'name', 'text'];
        const k = keys.find(key => typeof v[key] === 'string' && v[key]);
        v = k ? v[k] : (Object.values(v).find(x => typeof x === 'string' && x) || '');
        if (['file_path', 'path', 'file'].includes(k)) v = String(v).split(/[\\/]/).filter(Boolean).pop() || v;
      }
      v = String(v).replace(/\s+/g, ' ').trim();
      return v.length > 40 ? v.slice(0, 40) + '…' : v;
    }
    /** "Read draft.txt": the tool's name and a short summary of what it works on. */
    function toolStepText(name, input) {
      const s = toolSummary(input);
      return String(name || 'tool') + (s ? ' ' + s : '');
    }
    /** What a member's chip or roster line says: the step while it works, "done 22:51", "failed", the wait. */
    function memberStepLabel(m, slug) {
      if (!m) return '';
      if (coordWaiting(m, slug)) return 'waiting for the team';
      if (m.state === 'done') return 'done ' + clockTime(m.at);
      if (m.state === 'failed') return 'failed';
      return m.step || (m.state === 'working' ? 'working…' : '');
    }
    /** The coordinator's card closes when it hands work out; while a member still works or waits, it is waiting, not done. */
    function coordWaiting(m, slug) {
      if (!m || m.state !== 'done' || !slug || slug !== coordinator || mode === 'roundtable') return false;   // a roundtable takes turns
      for (const [s, v] of memberStates) if (s !== coordinator && (v.state === 'working' || v.state === 'waiting')) return true;
      return false;
    }
    function renderMember(slug) {
      const m = memberStates.get(slug);
      if (!m) return;
      const label = memberStepLabel(m, slug);
      const shown = coordWaiting(m, slug) ? 'waiting' : m.state;
      for (const id of ['step-', 'chipstep-']) {
        const el = document.getElementById(id + slug);
        if (el && el.textContent !== label) el.textContent = label;   // textContent: whatever a tool put in the summary stays text
      }
      for (const id of ['dot-', 'chipdot-']) {
        const el = document.getElementById(id + slug);
        if (el) el.className = (id === 'dot-' ? 'activity-dot ' : 'chip-dot ') + shown;
      }
    }
    function setMemberState(slug, state, step) {
      if (!slug) return;
      const prev = memberStates.get(slug);
      if (prev && prev.state === state && prev.step === (step || '') && state !== 'done') return;
      memberStates.set(slug, { state, step: step || '', at: eventNow || Date.now() });
      renderMember(slug);
      if (slug !== coordinator && coordinator) renderMember(coordinator);   // the coordinator's "waiting for the team" follows its members
    }
    /** The member's current step while it is working (a tool running, text arriving). */
    function setMemberStep(slug, step) { setMemberState(slug, 'working', step); }
    /** setDot's status says working / done / failed: the state follows it (a working member keeps the step it has). */
    function noteDotChange(slug, status) {
      if (status !== 'working' && status !== 'done' && status !== 'failed') return;
      const prev = memberStates.get(slug);
      if (status === 'working') { if (!prev || prev.state !== 'working') setMemberState(slug, 'working', 'starting…'); return; }
      setMemberState(slug, status, '');
    }
    /** A wait notice from the hub ("is busy with another conversation", "is on a voice call") as the short step text. */
    function noticeStepText(message) {
      const m = String(message || '');
      if (/voice call/i.test(m)) return 'waiting: on a voice call';
      if (/busy/i.test(m)) return 'waiting: busy';
      return 'waiting';
    }
    /** One chip per member: icon, name, state dot, current step. Tapping it scrolls to the member's latest card. */
    function buildChips() {
      const strip = document.getElementById('member-strip');
      if (!strip) return;
      const slugs = [];
      for (const s of [coordinator, ...participants, mode === 'roundtable' ? '' : challenger]) if (s && !slugs.includes(s)) slugs.push(s);
      strip.innerHTML = slugs.map(slug => {
        const a = agents[slug] || { display: slug, icon: '🤖' };
        return `<button type="button" class="member-chip ${getAgentColorClass(slug)}" role="listitem" data-slug="${esc(slug)}" id="chip-${esc(slug)}">` +
          `<span class="chip-icon">${esc(a.icon || '🤖')}</span>` +
          `<span class="chip-main"><span class="chip-name">${esc(a.display || slug)}</span><span class="chip-step" id="chipstep-${esc(slug)}"></span></span>` +
          `<span class="chip-dot" id="chipdot-${esc(slug)}"></span></button>`;
      }).join('');
      for (const slug of slugs) renderMember(slug);
    }
    /** Scroll the timeline to a member's latest card. */
    function scrollToMember(slug) {
      const tl = document.getElementById('timeline');
      if (!tl) return;
      const cards = Array.from(tl.querySelectorAll('.agent-block')).filter(b => b.dataset && b.dataset.agent === slug);
      const card = cards[cards.length - 1];
      if (card && card.scrollIntoView) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    document.getElementById('member-strip').addEventListener('click', (e) => {
      const chip = e.target && e.target.closest && e.target.closest('.member-chip');
      if (chip && chip.dataset.slug) scrollToMember(chip.dataset.slug);
    });

    async function removeParticipant(slug) {
      participants = participants.filter(p => p !== slug);
      buildRoster();
      await syncParticipants();
    }

    async function addParticipant(slug) {
      if (participants.includes(slug) || slug === coordinator) return;
      participants.push(slug);
      getAgentColorClass(slug);
      buildRoster();
      hideAddDropdown();
      await syncParticipants();
    }

    function showAddDropdown() {
      const dd = document.getElementById('add-dropdown');
      const available = Object.keys(agents).filter(s => s !== coordinator && !participants.includes(s));
      if (!available.length) { dd.innerHTML = '<div class="add-dropdown-item" style="color:var(--text-dim)">No agents available</div>'; }
      else { dd.innerHTML = available.map(s => { const a = agents[s]; return `<div class="add-dropdown-item" onclick="addParticipant('${esc(s)}')">${esc(a.icon || '🤖')} ${esc(a.display || s)}</div>`; }).join(''); }
      dd.style.display = 'block';
      document.addEventListener('click', hideAddOnOutsideClick, { once: true });
    }

    function hideAddDropdown() { document.getElementById('add-dropdown').style.display = 'none'; }
    function hideAddOnOutsideClick(e) { if (!e.target.closest('#add-dropdown') && !e.target.closest('#btn-add-participant')) hideAddDropdown(); }

    async function syncParticipants() {
      try {
        await fetch('/api/tiger-team/update-participants', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ participants, session_id: sessionId, tiger_team_id: tigerTeamId || undefined })
        });
      } catch (e) { console.error('Failed to sync participants:', e); }
    }

    function setStatus(cls, text) {
      const b = document.getElementById('status-badge');
      b.className = 'status-badge ' + cls;
      b.textContent = text;
    }

    function setRunning(running) {
      isRunning = running;
      document.getElementById('btn-stop').disabled = !running;
      if (running) setInputMode('running');
    }

    /** The target choices while the team runs: the team, the coordinator, and each member by name. */
    function buildTargetOptions() {
      const sel = document.getElementById('interject-target');
      if (!sel) return;
      const keep = sel.value;
      const opts = [['team', 'Team: coordinator + everyone working now'], ['coordinator', 'Coordinator only']];
      for (const slug of participants) opts.push([slug, ((agents[slug] && agents[slug].display) || slug) + ' only']);
      sel.innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
      if (opts.some(([v]) => v === keep)) sel.value = keep;
    }

    // ── Input bar: one control, three states (running / complete / ended) ──
    let inputMode = 'running';
    function setInputMode(m) {
      inputMode = m;
      const input = document.getElementById('user-input');
      const btn = document.getElementById('btn-send');
      const label = document.querySelector('.input-label');
      const sel = document.getElementById('interject-target');
      if (m === 'running') {
        buildTargetOptions();
        sel.style.display = '';
        label.textContent = '💬 Interject:';
        input.placeholder = 'Tell the team something now…';
        btn.textContent = 'Interject';
        btn.onclick = injectMessage;
        input.disabled = false; btn.disabled = false;
      } else if (m === 'complete') {
        sel.style.display = 'none';
        label.textContent = '🔄 Continue:';
        input.placeholder = 'Ask a follow-up or give a new directive…';
        btn.textContent = 'Continue';
        btn.onclick = continueSession;
        input.disabled = false; btn.disabled = false;   // what is in the box stays (a draft is never thrown away by the team finishing)
      } else {   // 'ended': stopped, failed or interrupted; a note resumes it from where it stopped
        sel.style.display = 'none';
        label.textContent = '🔄 Continue:';
        input.placeholder = 'A note for the team; it resumes from where it stopped…';
        btn.textContent = 'Resume with this note';
        btn.onclick = resumeWithNote;
        const can = !!(tigerTeamId && backendRecoveryAvailable);
        input.disabled = !can; btn.disabled = !can;
      }
      restoreUnsentNote();
    }

    // A note the page could not send (the team was running again in another window) is kept in this tab's storage for that
    // team, so the reload the page asks for does not lose it: it comes back into the empty box once, then is forgotten.
    function unsentNoteKey() { return tigerTeamId ? 'tt-unsent-note:' + tigerTeamId : ''; }
    function keepUnsentNote(note) { try { const k = unsentNoteKey(); if (k && note) { sessionStorage.setItem(k, note); return true; } } catch (e) {} return false; }
    function clearUnsentNote() { try { const k = unsentNoteKey(); if (k) sessionStorage.removeItem(k); } catch (e) {} }
    function restoreUnsentNote() {
      try {
        const k = unsentNoteKey(); if (!k) return;
        const note = sessionStorage.getItem(k); if (!note) return;
        const input = document.getElementById('user-input');
        if (input && !input.value.trim()) { input.value = note; if (typeof growInput === 'function') growInput(); }   // kept until something is sent (a replay may clear the box again)
      } catch (e) {}
    }

    // ── Stop ──
    async function stopSession() {
      // The team id works from any page, a reloaded one included; the session id is the page that started it.
      if (!sessionId && !tigerTeamId) return;
      try {
        const r = await fetch('/api/tiger-team/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId || undefined, tiger_team_id: tigerTeamId || undefined }) });
        if (r.ok) addSystemMsg('■ Stopping the team…');
        else if (r.status === 409) addSystemMsg((await r.json().catch(() => ({}))).error || 'This team has already ended.');
        else addSystemMsg('Stop failed: ' + ((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`));
      } catch (e) { console.error('Stop failed:', e); addSystemMsg('Stop failed: ' + e.message); }
    }

    // ── Inject ──
    let lastInterjectBlock = null;
    async function injectMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg || (!sessionId && !tigerTeamId)) return;
      input.value = ''; clearUnsentNote();
      sentInterjections.push(msg);   // drawn here now; its echo from the team's stream is skipped

      closeBlock();
      const tl = document.getElementById('timeline');
      const block = document.createElement('div');
      block.className = 'agent-block user-inject';
      const target = (document.getElementById('interject-target') || {}).value || 'team';
      block.innerHTML = `
        <div class="agent-block-header">
          <span class="block-icon">👤</span>
          <span class="block-agent">You</span>
          <span class="block-role">Interjection</span>
          <span class="block-time">${stamp()}</span>
        </div>
        <div class="agent-block-body"><div class="text-content">${md(msg)}</div><div class="interject-status" style="font-size:11px;color:var(--text-dim);margin-top:4px">sending…</div></div>`;
      tl.appendChild(block);
      scrollBottom();
      lastInterjectBlock = block;

      try {
        const ir = await fetch('/api/tiger-team/inject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId || undefined, tiger_team_id: tigerTeamId || undefined, message: msg, target }) });
        const ij = await ir.json().catch(() => ({}));
        const st = block.querySelector('.interject-status');
        if (!ir.ok) { st.textContent = '✗ ' + (ij.error || `HTTP ${ir.status}`); st.style.color = 'var(--tt-red)'; }
        else st.textContent = (ij.delivered || []).map(d => `${d.agent} (${d.how === 'live' ? 'now' : 'at its next step'})`).join(', ') ? 'sent to ' + (ij.delivered || []).map(d => `${d.agent} (${d.how === 'live' ? 'now' : 'at its next step'})`).join(', ') + ' · waiting for pickup…' : 'sent';
      } catch (e) { addSystemMsg('Inject failed: ' + e.message); }
    }

    // ── Additional Rounds Approval ──
    function showRoundsApproval(justification, proposedRounds) {
      // Disable the main inject/continue input globally while an approval
      // decision is pending - prevents the input box AND the approve button
      // from both being simultaneously actionable (double-trigger source).
      document.getElementById('user-input').disabled = true;
      document.getElementById('btn-send').disabled = true;

      const tl = document.getElementById('timeline');
      const block = document.createElement('div');
      block.className = 'agent-block user-inject';
      block.style.borderColor = 'var(--tt-amber)';
      block.style.background = 'var(--tt-amber-05)';
      block.innerHTML = `
        <div class="agent-block-header">
          <span class="block-icon">⚠️</span>
          <span class="block-agent" style="color:var(--tt-amber)">Additional Rounds Requested</span>
          <span class="block-time">${stamp()}</span>
        </div>
        <div class="agent-block-body">
          <div class="text-content">
            <p><strong>The coordinator is requesting ${esc(proposedRounds)} additional round${proposedRounds > 1 ? 's' : ''}.</strong></p>
            <p><strong>Justification:</strong> ${esc(justification)}</p>
          </div>
          <div style="margin-top:12px;display:flex;gap:10px">
            <button class="approve-rounds-btn" style="padding:8px 16px;background:var(--tt-green);color:var(--tt-on-fill);border:none;border-radius:6px;cursor:pointer;font-weight:600">✓ Approve</button>
            <button onclick="denyAdditionalRounds()" style="padding:8px 16px;background:var(--tt-red);color:var(--tt-on-fill);border:none;border-radius:6px;cursor:pointer;font-weight:600">✗ Deny</button>
          </div>
        </div>`;
      // The justification is agent text: it is never placed inside an inline handler.
      const approveBtn = block.querySelector('.approve-rounds-btn');
      if (approveBtn) approveBtn.addEventListener('click', () => approveAdditionalRounds(String(justification || '').slice(0, 200)));
      tl.appendChild(block);
      scrollBottom();
    }

    async function approveAdditionalRounds(justification) {
      if (continuationInFlight) return; // Guard against double-click firing two /continue POSTs
      continuationInFlight = true;

      // Remove the approval buttons
      const btns = event.target.closest('div');
      btns.innerHTML = '<span style="color:var(--tt-green);font-weight:600">✓ Approved - Continuing...</span>';

      addDivider('Reconvening Team (Additional Rounds)', 'round');
      setStatus('running', 'Continuing...');
      document.title = '⏳ Tiger Team - Additional Rounds';

      try {
        const resp = await fetch('/api/tiger-team/continue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: tigerTeamId, message: 'Approved. Continue your investigation. ' + justification }),
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          if (resp.status === 409) {
            addSystemMsg('⚠ ' + (errData.error || 'A continuation is already in progress for this session.'));
          } else {
            addSystemMsg('Continuation failed: ' + (errData.error || `HTTP ${resp.status}`));
          }
          setStatus('error', 'Error');
          return;
        }

        isRunning = true;
        document.getElementById('btn-stop').disabled = false;
        sentInterjections.push('Approved. Continue your investigation. ' + justification);   // drawn here as the divider above

        try { await readSSE(resp); await afterStreamEnd('Stream ended without completion'); }
        catch (e) { await afterStreamEnd(e.message); }
      } catch (e) {
        handleEvent({ gateway: { type: 'tt_interrupted', reason: e.message } });
      } finally {
        continuationInFlight = false;
      }
    }

    function denyAdditionalRounds() {
      const btns = event.target.closest('div');
      btns.innerHTML = '<span style="color:var(--tt-red);font-weight:600">✗ Denied - Session ending as-is</span>';
      setStatus('complete', 'Complete');
      setRunning(false);
      showContinueUI();
    }

    // ── Continue (after completion) ──
    function showContinueUI() {
      setInputMode('complete');
    }

    // ── Resume with a note (after a stop, failure or interruption) ──
    // POST /api/tiger-team/resume takes an optional message: the server queues it for the coordinator (durably,
    // like an interjection) before the team resumes. An empty note just resumes.
    async function resumeWithNote() {
      if (continuationInFlight) return;
      const input = document.getElementById('user-input');
      const note = input.value.trim();
      // The note stays in the input until the resume POST answers OK: resumeInterruptedTeam draws the card and clears it then.
      await resumeInterruptedTeam(note);
    }

    /** The "Note" card of a Resume, drawn only once the hub accepted the resume (never for a note that was not sent). */
    function drawNoteCard(note) {
      sentInterjections.push(note);   // drawn just below; its echo from the team's stream is skipped
      closeBlock();
