              banner.textContent = `↻ Retrying (attempt ${gw.attempt || '?'}${delaySec ? `, waiting ${delaySec}s` : ''}): ${gw.message || 'transient error'}`;
              banner.style.display = 'block';
              setTimeout(() => { banner.style.display = 'none'; }, 8000);
            }
            addSystemMsg(`↻ Retry attempt ${gw.attempt || '?'}: ${gw.message || 'transient error'}`);
            break;

          case 'tool_start':
            // Skip consult_agent tool events - they're redundant with tt_dispatch
            if (gw.tool === 'consult_agent') {
              if (gw.tool_call_id) skipToolIds.add(toolKey(evt, gw));
              break;
            }
            if (!currentBlock) openBlock(coordinator, 'Coordinator');
            addTool(gw.tool, toolKey(evt, gw), gw.input);
            break;

          case 'tool_use':
            // Update tool input display (tool_use carries the input summary)
            if (gw.tool === 'consult_agent') break;
            if (!currentBlock) break;
            const toolLine = (toolMap.get(toolKey(evt, gw)) || {}).line;
            if (toolLine && gw.input) {
              let inputEl = toolLine.querySelector('.tool-call-input');
              if (!inputEl) {
                const infoEl = toolLine.querySelector('.tool-call-info');
                if (infoEl) {
                  inputEl = document.createElement('span');
                  inputEl.className = 'tool-call-input';
                  infoEl.appendChild(inputEl);
                }
              }
              if (inputEl) inputEl.textContent = String(gw.input).slice(0, 100);
            }
            break;

          case 'tool_result':
            // Skip consult_agent results - represented by tt_dispatch_complete
            if (skipToolIds.has(toolKey(evt, gw))) {
              skipToolIds.delete(toolKey(evt, gw));
              break;
            }
            completeTool(toolKey(evt, gw), gw.output);
            break;
        }
      }

      // Text deltas
      const content = evt.choices?.[0]?.delta?.content;
      if (content) {
        if (member) { appendBlockText(content, member); return; }
        if (!currentBlock) openBlock(coordinator, 'Coordinator');
        appendBlockText(content);
      }
    }

    // Enter key sends
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('btn-send').click(); }
    });

    // ── Save Session ──
    let loadedSaveId = null;
    let loadedSaveTitle = null;

    async function saveSession() {
      const timeline = document.getElementById('timeline');
      const transcript = timeline.innerHTML;
      // If loaded from existing save, overwrite it directly (no prompt)
      let title = loadedSaveTitle;
      let saveId = loadedSaveId;
      if (!saveId) {
        title = prompt('Name this investigation:', objectiveText?.slice(0, 80) || 'Untitled');
        if (!title) return;
      }
      try {
        const resp = await fetch('/api/tiger-team/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            save_id: saveId || undefined,
            title,
            objective: objectiveText,
            coordinator,
            participants,
            transcript,
            mode,
          })
        });
        const data = await resp.json();
        if (data.ok) {
          // Track the save ID so subsequent saves also overwrite
          loadedSaveId = data.id;
          loadedSaveTitle = title;
          addSystemMsg(`💾 Session saved as "${title}"`);
        } else {
          addSystemMsg('Save failed: ' + (data.error || 'Unknown error'));
        }
      } catch (e) { addSystemMsg('Save failed: ' + e.message); }
    }

    // ── Load Saved Panel ──
    let savedPanelOpen = false;
    // Every way the saved-sessions panel goes away (✕, Esc, the backdrop, choosing a session) also tells the dialog
    // guard, so a hidden panel never stays the top layer.
    function closeSavedPanel() {
      const panel = document.getElementById('saved-panel');
      panel.style.display = 'none';
      savedPanelOpen = false;
      if (window.dialogGuard) dialogGuard.closed(panel);
    }
    async function toggleSavedPanel() {
      const panel = document.getElementById('saved-panel');
      if (savedPanelOpen) { closeSavedPanel(); return; }
      panel.style.display = 'block';
      savedPanelOpen = true;
      if (window.dialogGuard) dialogGuard.open(panel, { close: closeSavedPanel });   // Esc and the backdrop close it (lib/ui-dialog.js)
      const list = document.getElementById('saved-list');
      list.innerHTML = 'Loading...';
      try {
        const resp = await fetch('/api/tiger-team/saved');
        const data = await resp.json();
        if (!data.sessions || data.sessions.length === 0) {
          list.innerHTML = '<p style="color:var(--text-dim);">No saved sessions yet.</p>';
          return;
        }
        list.innerHTML = data.sessions.map(s => {
          const statusBadge = ['interrupted', 'stopped', 'blocked'].includes(s.status)
            ? '<span style="color:#ffb74d;margin-left:8px">' + s.status.toUpperCase() + ' - RESUMABLE</span>'
            : s.status === 'in_progress' 
            ? '<span style="background:rgba(255,152,0,0.2); color:#ffb74d; padding:1px 6px; border-radius:3px; font-size:10px; margin-left:8px;">IN PROGRESS</span>'
            : s.auto_saved 
              ? '<span style="background:rgba(76,175,80,0.2); color:#81c784; padding:1px 6px; border-radius:3px; font-size:10px; margin-left:8px;">AUTO-SAVED</span>'
              : '';
          return `
          <div style="border:1px solid var(--border); border-radius:6px; padding:12px; cursor:pointer; transition:border-color 0.2s;" 
               onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'"
               onclick="openSaved('${esc(s.id)}')">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="color:var(--text);">${esc(s.title)}${statusBadge}</strong>
              <span style="font-size:11px; color:var(--text-dim);">${new Date(s.saved_at).toLocaleDateString()} ${new Date(s.saved_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
            </div>
            <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">${esc(s.objective || '')}</div>
            <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">👑 ${esc(s.coordinator)} · 👥 ${esc((s.participants||[]).join(', '))}</div>
            <button onclick="event.stopPropagation(); deleteSaved('${esc(s.id)}', this.closest('div[style*=border]'))"
                    style="margin-top:8px; background:none; border:1px solid rgba(255,76,76,0.3); color:var(--error); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:11px;">🗑 Delete</button>
          </div>`;
        }).join('');
      } catch (e) {
        list.innerHTML = `<p style="color:var(--error);">Error: ${e.message}</p>`;
      }
    }

    async function reconcileUnknownOutcomes() {
      if (!tigerTeamId || isRunning) { alert('Load a stopped investigation first.'); return; }
      try {
        const status = await fetch('/api/tiger-team/status?id=' + encodeURIComponent(tigerTeamId));
        const data = await status.json();
        if (!status.ok) throw new Error(data.error || 'Status failed');
        if (!data.unresolved?.length) { alert('No uncertain tool outcomes.'); return; }
        for (const tool of data.unresolved) {
          const label = tool.name + ' [' + tool.callKey + ' / ' + tool.toolId + ']';
          const evidence = prompt('Verify this operation outside the agent before continuing: ' + label + '\nEnter how you verified its actual outcome (Cancel leaves it blocked):');
          if (!evidence?.trim()) return;
          const result = prompt('Enter the verified result for ' + label + '.  This is recorded as operator-supplied evidence, not a rerun:');
          if (!result?.trim()) return;
          if (!confirm('Record this verified outcome and allow Resume?\n' + label + '\n' + result)) return;
          const resp = await fetch('/api/tiger-team/reconcile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: tigerTeamId, callKey: tool.callKey, toolId: tool.toolId, result, evidence }) });
          const saved = await resp.json();
          if (!resp.ok) throw new Error(saved.error || 'Reconciliation failed');
        }
        addSystemMsg('Verified outcomes recorded.  Resume is available.  No tools were replayed.');
      } catch (e) { alert(e.message); }
    }

    function downloadFullRecord() {
      if (!tigerTeamId) { alert('Start or load an investigation first.'); return; }
      const link = document.createElement('a');
      link.href = '/api/tiger-team/archive/' + encodeURIComponent(tigerTeamId) + '?download=1';
      link.download = tigerTeamId + '-full-record.json';
      link.click();
    }

    /** A saved session from the list: redrawn from its own events when it has them, else its saved transcript. */
    async function openSaved(id) {
      if (isRunning) { window.open('/tiger-team?load=' + encodeURIComponent(id), '_blank'); return; }   // this page follows a running team
      closeSavedPanel();
      if (await loadTeam(id)) return;
      await loadSaved(id);
    }

    async function loadSaved(id) {
      try {
        const resp = await fetch(`/api/tiger-team/saved/${id}`);
        const data = await resp.json();
        if (!resp.ok) { alert(data.error || 'Load failed'); return; }
        
        // Restore UI state
        closeSavedPanel();
        
        // Set header
        objectiveText = data.objective;
        document.getElementById('objective-text').textContent = data.objective || '';
        const status = data.status || 'complete';
        const statusLabelMap = { completed: 'Complete', running: 'Running elsewhere', retrying: 'Retrying', stopping: 'Stopping', complete: 'Loaded', interrupted: 'Interrupted', stopped: 'Stopped', blocked: 'Blocked', in_progress: 'In Progress (stale)' };
        const statusClassMap = { completed: 'complete', running: 'running', retrying: 'running', stopping: 'error', complete: 'complete', interrupted: 'error', stopped: 'error', blocked: 'error', in_progress: 'error' };
        document.getElementById('status-badge').textContent = statusLabelMap[status] || 'Loaded';
        document.getElementById('status-badge').className = 'status-badge ' + (statusClassMap[status] || 'complete');
        
        // Restore roster
        coordinator = data.coordinator;
        mode = data.mode || 'led';
        participants = data.participants || [];
        buildRoster();
        
        // Restore transcript.  Durable-only entries (recovered from a
        // checkpoint with no legacy HTML save) have no `transcript` HTML -
        // render plainTranscript safely as escaped/markdown text instead of
        // assuming HTML is present.
        const timeline = document.getElementById('timeline');
        if (data.transcript && data.transcript.trim()) {
          const rawTranscript = data.transcript;
          if (purifyReady()) {
            // No inline handlers survive a save: the "▶ output" toggles work through the delegated
            // listener (data-call-id, else the sibling result block); approval buttons are history.
            timeline.innerHTML = DOMPurify.sanitize(rawTranscript, {
              ADD_ATTR: ['target','rel','class','id','data-call-id'],
              FORBID_TAGS: ['script','iframe','object','embed','form','input','textarea','select','style'],
              FORBID_ATTR: ['style','onerror','onload','onclick','onmouseover','onfocus','onblur','onmouseenter','onanimationend']
            });
          } else {
            timeline.textContent = rawTranscript;   // fail closed: no sanitizer, no HTML
          }
        } else if (data.plainTranscript && data.plainTranscript.trim()) {
          // Text/markdown-safe render - never trust this as raw HTML.
          if (purifyReady()) timeline.innerHTML = md(data.plainTranscript);
          else timeline.textContent = data.plainTranscript;
        } else {
          timeline.innerHTML = '<p style="color:var(--text-dim);">No transcript data.</p>';
        }
        
        // Set session IDs so continue/resume work
        tigerTeamId = data.tiger_team_id || (data.durable ? data.session_id : null) || id;
        sessionId = id;
        // Stable save key: original session_id if present, else id stripped of auto_ prefixes
        saveKey = String(data.session_id || id).replace(/^(auto_)+/, '');
        // Track loaded save so Save button overwrites same file
        loadedSaveId = id;
        loadedSaveTitle = data.title;
        if (backendRecoveryAvailable) {
          const url = new URL(window.location.href);
          url.searchParams.set('load', tigerTeamId); url.searchParams.delete('launch');
          history.replaceState(null, '', url.toString());
        }
        
        const btn = document.getElementById('btn-send');
        const input = document.getElementById('user-input');
        const label = document.querySelector('.input-label');
        const resumeBtn = document.getElementById('btn-resume');
        document.getElementById('btn-save').disabled = false;

        if (['interrupted', 'stopped', 'blocked', 'running', 'retrying', 'stopping', 'in_progress'].includes(status)) {
          // Offer Resume for anything that did not reach a clean completion.
          input.disabled = true;
          btn.disabled = true;
          if (label) label.textContent = '⏸ Not running:';
          resumeBtn.style.display = backendRecoveryAvailable ? 'inline-flex' : 'none';
          if (data.error) {
            const banner = document.getElementById('tt-error-banner');
            banner.textContent = '⚠ ' + data.error;
            banner.style.display = 'block';
          }
        } else {
          // Completed (or legacy in_progress with no durable status) - normal continue flow.
          resumeBtn.style.display = 'none';
          input.disabled = false;
          input.placeholder = 'Ask a follow-up question or give a new directive to reconvene the team...';
          btn.disabled = false;
          btn.onclick = continueSession;
          if (label) label.textContent = '🔄 Continue:';
        }
        
        addSystemMsg(`📂 Loaded saved session: "${data.title}"${data.durable ? ' (recovered from checkpoint)' : ''}`);
      } catch (e) { alert('Load failed: ' + e.message); }
    }

    // ── Resume Interrupted Team ──
    // GET /status first to avoid a duplicate launch if the team turns out to
    // already be running (e.g. two tabs open on the same investigation).
    // No automatic retry on failure - resume outcome is ambiguous if the
    // request fails mid-flight, so the user must explicitly click again.
    async function resumeInterruptedTeam() {
      if (!tigerTeamId || continuationInFlight) return;
      const resumeBtn = document.getElementById('btn-resume');
      resumeBtn.disabled = true;
      resumeBtn.textContent = '⏳ Checking status...';
      document.getElementById('tt-error-banner').style.display = 'none';

      try {
        const statusResp = await fetch(`/api/tiger-team/status?id=${encodeURIComponent(tigerTeamId)}`);
        if (statusResp.status === 404) {
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          addSystemMsg('No saved recovery state was found for this investigation.  Try loading its latest saved session.');
          return;
        }
        if (!statusResp.ok) throw new Error('Status check HTTP ' + statusResp.status);
        const statusData = await statusResp.json();
        if (statusData.id) tigerTeamId = statusData.id;
        if (statusData.status === 'completed') { if (!(await loadTeam(tigerTeamId))) await loadSaved(tigerTeamId); return; }
        if (statusResp.ok && ['running', 'retrying', 'stopping'].includes(statusData.status)) {
          // Still working (a closed page no longer stops a team): follow it instead of starting a second run.
          resumeBtn.style.display = 'none';
          if (statusData.has_stream && await loadTeam(tigerTeamId)) return;
          addSystemMsg('⚠ This Tiger Team is already running elsewhere - not launching a duplicate. Check other open tabs.');
          resumeBtn.style.display = 'inline-flex';
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          return;
        }
      } catch (e) {
        addSystemMsg('Status check failed: ' + e.message + ' - resume aborted (no automatic retry).');
        resumeBtn.disabled = false;
        resumeBtn.textContent = '▶ Resume Interrupted';
        return;
      }

      continuationInFlight = true;
      resumeBtn.textContent = '⏳ Resuming...';
      addDivider('Resuming Interrupted Team', 'round');
      setStatus('running', 'Resuming...');
      document.title = '⏳ Tiger Team - Resuming';
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('btn-send');
      input.disabled = true;
      sendBtn.disabled = true;

      try {
        const resp = await fetch('/api/tiger-team/resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: tigerTeamId }),
        });
        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          addSystemMsg('Resume failed: ' + (errData.error || `HTTP ${resp.status}`));
          setStatus('error', 'Resume Failed');
          resumeBtn.disabled = false;
          resumeBtn.textContent = '▶ Resume Interrupted';
          continuationInFlight = false;
          return;
        }

        isRunning = true;
        resumeBtn.style.display = 'none';
        document.getElementById('btn-stop').disabled = false;

        // Raw EOF with no tt_complete/tt_error means the connection dropped mid-stream - that is not a successful
        // completion: afterStreamEnd follows the team again, or reports the interruption on an old hub.
        try { await readSSE(resp); await afterStreamEnd('Stream ended without completion'); }
        catch (e) { await afterStreamEnd(e.message); }
      } catch (e) {
        handleEvent({ gateway: { type: 'tt_interrupted', reason: e.message } });
      } finally {
        continuationInFlight = false;
      }
    }

    async function deleteSaved(id, element) {
      if (!confirm('Delete this saved session?')) return;
      try {
        await fetch(`/api/tiger-team/saved/${id}`, { method: 'DELETE' });
        if (element) element.remove();
      } catch (e) { alert('Delete failed: ' + e.message); }
    }

    // Store objective text for save
    let objectiveText = objective;

    // ── Auto-save system ──
    async function autoSave() {
      if (!saveKey && !sessionId && !tigerTeamId) return;
      const now = Date.now();
      if (now - lastAutoSave < 10000) return; // Debounce: no more than every 10s
      lastAutoSave = now;
      const timeline = document.getElementById('timeline');
      const transcript = timeline ? timeline.innerHTML : '';
      try {
        await fetch('/api/tiger-team/autosave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: saveKey || sessionId || tigerTeamId,
            objective: objectiveText,
            coordinator,
            participants,
            transcript,
            mode,
            status: isRunning ? 'in_progress' : (document.getElementById('status-badge').classList.contains('complete') ? 'complete' : 'interrupted'),
          })
        });
      } catch (e) { /* silent - auto-save is best-effort */ }
    }

    function startAutoSave() {
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      autoSaveInterval = setInterval(autoSave, 30000); // Every 30s
    }

    function stopAutoSave() {
      if (autoSaveInterval) { clearInterval(autoSaveInterval); autoSaveInterval = null; }
      autoSave(); // Final save on stop
    }

    // Save on page unload (navigation away, close tab)
    window.addEventListener('beforeunload', () => {
      if (saveKey || sessionId || tigerTeamId) {
        const timeline = document.getElementById('timeline');
        const transcript = timeline ? timeline.innerHTML : '';
        // Use sendBeacon with Blob for reliable save on unload
        const blob = new Blob([JSON.stringify({
          session_id: saveKey || sessionId || tigerTeamId,
          objective: objectiveText,
          coordinator,
          participants,
          transcript,
          mode,
          status: isRunning ? 'in_progress' : (document.getElementById('status-badge').classList.contains('complete') ? 'complete' : 'interrupted'),
        })], { type: 'application/json' });
        navigator.sendBeacon('/api/tiger-team/autosave', blob);
      }
    });

    init();
  </script>
</body>
</html>
