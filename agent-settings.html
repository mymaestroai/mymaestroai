<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Agent settings</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem 1.25rem; }
  a { color: LinkText; }
</style>
</head>
<body>
<!-- The old agent settings page is gone: every setting of an agent is on its card. Old links (notices, bookmarks) land here and are sent on:
     ?agent=<name>#rec=OPT-n  ->  the card at that row (/#agent-card=<name>&row=OPT-n), or Settings (/#settings-for=OPT-n) when the record lives there;
     ?agent=<name> with no hash or a section word  ->  the card (/#agent-card=<name>);  no or bad name  ->  /.  A phone goes to /mobile instead of /. -->
<p id="msg">Opening settings…</p>
<script>
(function () {
  'use strict';
  var NAME_RE = /^[\w.@-]{1,64}$/;      // the same rule as the agent card
  var REC_RE = /(?:^#|&)rec=(OPT-\d{1,6})(?:&|$)/;
  var msg = document.getElementById('msg');

  function agentName() {
    var v = null;
    try { v = new URLSearchParams(window.location.search).get('agent'); } catch (e) { v = null; }
    return v && NAME_RE.test(v) ? v : null;
  }
  function recId() {
    var m = REC_RE.exec(String(window.location.hash || ''));
    return m ? m[1] : null;
  }
  // The phone test of lib/ui-phone-layout.js (a touch screen with a short side under 600 and a finger as the main pointer), the person's own
  // "keep the full site" choice, or arriving from the phone page.
  function onPhone() {
    try { if (window.localStorage.getItem('hub-keep-desktop') === '1') return false; } catch (e) { /* none */ }
    try { if (/\/mobile(?:[/?#]|$)/.test(String(document.referrer || '').replace(/^[a-z]+:\/\/[^/]*/i, ''))) return true; } catch (e) { /* none */ }
    try {
      var w = window.screen.width, h = window.screen.height;
      if (!(w > 0 && h > 0) || Math.min(w, h) >= 600) return false;
      var coarse = window.matchMedia('(pointer: coarse)').matches === true, fine = window.matchMedia('(pointer: fine)').matches === true;
      if (fine && !coarse) return false;
      return Number(window.navigator.maxTouchPoints) > 0 || coarse;
    } catch (e) { return false; }
  }
  function urlFor(name, rec, toSettings) {
    var base = onPhone() ? '/mobile#' : '/#';
    if (!name) return onPhone() ? '/mobile' : '/';
    if (toSettings && rec) return base + 'settings-for=' + rec;
    return base + 'agent-card=' + encodeURIComponent(name) + (rec ? '&row=' + rec : '');
  }
  var gone = false;
  function go(name, rec, toSettings) {
    if (gone) return;
    gone = true;
    var url = urlFor(name, rec, toSettings);
    msg.textContent = '';
    if (name) msg.appendChild(document.createTextNode('Opening ' + name + '’s settings… '));
    else msg.appendChild(document.createTextNode('Opening the hub… '));
    var a = document.createElement('a');
    a.setAttribute('href', url);
    a.textContent = 'Continue';
    msg.appendChild(a);
    window.location.replace(url);   // replace, so Back does not return to this page
  }

  var name = agentName();
  var rec = recId();
  if (!name) { go(null, null, false); return; }
  if (!rec) { go(name, null, false); return; }
  // A record id: the records say where it lives. If they cannot be read, the card is the guess (it ignores a row it does not know).
  var timer = setTimeout(function () { go(name, rec, false); }, 4000);
  try {
    fetch('/api/settings-records', { credentials: 'include' })
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (d) {
        clearTimeout(timer);
        var list = d && Array.isArray(d.records) ? d.records : (Array.isArray(d) ? d : []);
        var found = null;
        for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === rec) { found = list[i]; break; }
        var home = found && typeof found.home === 'string' ? found.home : '';
        go(name, rec, !!home && home.indexOf('Agent card') !== 0);
      })
      .catch(function () { clearTimeout(timer); go(name, rec, false); });
  } catch (e) { clearTimeout(timer); go(name, rec, false); }
})();
</script>
</body>
</html>
