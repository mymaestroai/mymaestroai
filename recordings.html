<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Recordings</title>
<script src="/ui-looks.js"></script>
<style>
:root {
  --rc-bg: #1a1a2e;
  --rc-text: #e0e0e0;
  --rc-strong: #fff;
  --rc-on-fill: #fff;
  --rc-accent: #4a9eff;
  --rc-dim1: #aaa;
  --rc-dim2: #999;
  --rc-dim3: #bbb;
  --rc-soft: #ccc;
  --rc-err: #ff7b72;
  --rc-edge: #444;
  --rc-btn: #2d2d44;
  --rc-danger: #e74c3c;
  --rc-field: #0f0f23;
  --rc-line: #333;
  --rc-warn: #e0b050;
  --rc-faint1: #888;
  --rc-faint2: #777;
  --rc-agent: #9ecbff;
  --rc-dialog: #14171F;
}
html[data-look]:not([data-look="engineering"]) {
  --rc-bg: var(--bg-dark);
  --rc-text: var(--text);
  --rc-strong: var(--text);
  --rc-on-fill: var(--on-color-text);
  --rc-accent: var(--accent);
  --rc-dim1: var(--text-dim);
  --rc-dim2: var(--text-dim);
  --rc-dim3: var(--text-dim);
  --rc-soft: var(--text);
  --rc-err: var(--error);
  --rc-edge: var(--border-strong);
  --rc-btn: var(--bg-card);
  --rc-danger: var(--error);
  --rc-field: var(--bg-input);
  --rc-line: var(--border);
  --rc-warn: var(--warning);
  --rc-faint1: var(--text-tertiary);
  --rc-faint2: var(--text-tertiary);
  --rc-agent: var(--accent);
  --rc-dialog: var(--bg-card);
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--rc-bg); color: var(--rc-text); padding: 16px; line-height: 1.45;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; color: var(--rc-strong); flex: 1; }
  a.back { color: var(--rc-accent); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; font-size: 15px; }
  h2 { font-size: 17px; color: var(--rc-strong); margin-bottom: 6px; }
  h3 { margin: 20px 0 8px; color: var(--rc-dim1); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .note { color: var(--rc-dim2); font-size: 13px; margin-top: 6px; }
  .plain { color: var(--rc-soft); font-size: 15px; padding: 12px 0; }
  .error { color: var(--rc-err); font-size: 15px; padding: 12px 0; }
  .btn {
    min-height: 44px; padding: 0 18px; border: 1px solid var(--rc-edge); border-radius: 8px; cursor: pointer;
    font-size: 15px; font-weight: 500; background: var(--rc-btn); color: var(--rc-text); text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:hover { border-color: var(--rc-accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--rc-accent); border-color: var(--rc-accent); color: var(--rc-on-fill); }
  .btn-danger { background: var(--rc-danger); border-color: var(--rc-danger); color: var(--rc-on-fill); }
  .btn:focus-visible, a.back:focus-visible, input:focus-visible, audio:focus-visible { outline: 2px solid var(--rc-accent); outline-offset: 2px; }
  .agents { display: flex; flex-direction: column; gap: 8px; }
  .agent-row { text-align: left; justify-content: flex-start; width: 100%; flex-wrap: wrap; gap: 4px 12px; padding: 10px 14px; }
  .summary { color: var(--rc-dim3); font-size: 15px; margin-bottom: 12px; }
  .session { background: var(--rc-field); border: 1px solid var(--rc-line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .s-when { color: var(--rc-strong); font-size: 15px; font-weight: 600; }
  .s-meta { color: var(--rc-dim1); font-size: 14px; margin-top: 2px; }
  .s-first { color: var(--rc-soft); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .s-flag { color: var(--rc-warn); font-size: 13px; margin-top: 4px; }
  .s-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .convo { margin-top: 12px; border-top: 1px solid var(--rc-line); padding-top: 10px; }
  .line { margin-bottom: 12px; overflow-wrap: anywhere; }
  .who { color: var(--rc-faint1); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .line.agent .said { color: var(--rc-agent); }
  .line.person .said { color: var(--rc-text); }
  .said { font-size: 15px; white-space: pre-wrap; }
  .event { color: var(--rc-faint2); font-size: 12px; margin-bottom: 10px; }
  audio { width: 100%; margin: 6px 0 4px; }
  dialog { margin: auto; width: min(92vw, 420px); padding: 20px; border: 1px solid var(--rc-edge); border-radius: 12px; background: var(--rc-dialog); color: var(--rc-text); font: inherit; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin-bottom: 12px; font-size: 15px; }
  dialog input[type="text"] { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--rc-line); border-radius: 6px; background: var(--rc-field); color: var(--rc-text); font-size: 16px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .dlg-err { color: var(--rc-err); font-size: 14px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back-link" href="/">&larr; Back to chat</a>
    <h1>Recordings</h1>
  </div>
  <div id="content"><div class="plain">Loading…</div></div>
</div>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete this recording?</h2>
  <p id="delete-text"></p>
  <input type="text" id="delete-box" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type DELETE to confirm" data-no-dirty>
  <div class="dlg-err" id="delete-err" role="alert"></div>
  <div class="dlg-btns">
    <button type="button" class="btn" id="delete-cancel">Cancel</button>
    <button type="button" class="btn btn-danger" id="delete-confirm" disabled>Delete</button>
  </div>
</dialog>

<script src="/ui-dialog.js"></script>
<script src="/recordings.js"></script>
</body>
</html>
