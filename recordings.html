<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Recordings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0; padding: 16px; line-height: 1.45;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; color: #fff; flex: 1; }
  a.back { color: #4a9eff; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; font-size: 15px; }
  h2 { font-size: 17px; color: #fff; margin-bottom: 6px; }
  h3 { margin: 20px 0 8px; color: #aaa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .note { color: #999; font-size: 13px; margin-top: 6px; }
  .plain { color: #ccc; font-size: 15px; padding: 12px 0; }
  .error { color: #ff7b72; font-size: 15px; padding: 12px 0; }
  .btn {
    min-height: 44px; padding: 0 18px; border: 1px solid #444; border-radius: 8px; cursor: pointer;
    font-size: 15px; font-weight: 500; background: #2d2d44; color: #e0e0e0; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:hover { border-color: #4a9eff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: #4a9eff; border-color: #4a9eff; color: #fff; }
  .btn-danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .btn:focus-visible, a.back:focus-visible, input:focus-visible, audio:focus-visible { outline: 2px solid #4a9eff; outline-offset: 2px; }
  .agents { display: flex; flex-direction: column; gap: 8px; }
  .agent-row { text-align: left; justify-content: flex-start; width: 100%; flex-wrap: wrap; gap: 4px 12px; padding: 10px 14px; }
  .summary { color: #bbb; font-size: 15px; margin-bottom: 12px; }
  .session { background: #0f0f23; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .s-when { color: #fff; font-size: 15px; font-weight: 600; }
  .s-meta { color: #aaa; font-size: 14px; margin-top: 2px; }
  .s-first { color: #ccc; font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .s-flag { color: #e0b050; font-size: 13px; margin-top: 4px; }
  .s-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .convo { margin-top: 12px; border-top: 1px solid #333; padding-top: 10px; }
  .line { margin-bottom: 12px; overflow-wrap: anywhere; }
  .who { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .line.agent .said { color: #9ecbff; }
  .line.person .said { color: #e0e0e0; }
  .said { font-size: 15px; white-space: pre-wrap; }
  .event { color: #777; font-size: 12px; margin-bottom: 10px; }
  audio { width: 100%; margin: 6px 0 4px; }
  dialog { margin: auto; width: min(92vw, 420px); padding: 20px; border: 1px solid #444; border-radius: 12px; background: #14171F; color: #e0e0e0; font: inherit; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin-bottom: 12px; font-size: 15px; }
  dialog input[type="text"] { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid #333; border-radius: 6px; background: #0f0f23; color: #e0e0e0; font-size: 16px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .dlg-err { color: #ff7b72; font-size: 14px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back-link" href="/">&larr; Back to chat</a>
    <h1>Recordings</h1>
  </div>
  <div id="content"><div class="plain">Loading…</div></div>
</div>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete this recording?</h2>
  <p id="delete-text"></p>
  <input type="text" id="delete-box" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type DELETE to confirm" data-no-dirty>
  <div class="dlg-err" id="delete-err" role="alert"></div>
  <div class="dlg-btns">
    <button type="button" class="btn" id="delete-cancel">Cancel</button>
    <button type="button" class="btn btn-danger" id="delete-confirm" disabled>Delete</button>
  </div>
</dialog>

<script src="/ui-dialog.js"></script>
<script src="/recordings.js"></script>
</body>
</html>
